<!DOCTYPE html>
<!-- Fork of design-systems/t1/ui_kit/template/chat-interface.html for project t1-vehicle-search.
     Asset paths point at the read-only design system (../../design-systems/t1/...).
     Do not rebuild the shell or edit .ts-menubar/.ts-body. Work lives in RESPONSES + the seeded thread. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T1 AI Sales Assistant</title>

  <!-- Fonts (relative to server root /; server.js serves project root as /) -->
  <style>
    /* Font paths resolve via server.js: /template/* → /ui_kit/template/*,
       other paths served from project root. Fonts are at /fonts/ (project root). */
    @font-face { font-family:"Proxima Nova"; font-weight:300; src:url("../../design-systems/t1/fonts/Proxima-Nova-Light.otf")   format("opentype"); font-display:swap; }
    @font-face { font-family:"Proxima Nova"; font-weight:400; src:url("../../design-systems/t1/fonts/Proxima-Nova-Regular.otf") format("opentype"); font-display:swap; }
    @font-face { font-family:"Proxima Nova"; font-weight:500; src:url("../../design-systems/t1/fonts/Proxima-Nova-Medium.otf")  format("opentype"); font-display:swap; }
    @font-face { font-family:"Proxima Nova"; font-weight:600; src:url("../../design-systems/t1/fonts/Proxima-Nova-Semibold.otf")format("opentype"); font-display:swap; }
  </style>

  <!-- Kit CSS — paths resolve against page URL /template/; ../ = project root -->
  <link rel="stylesheet" href="../../design-systems/t1/colors_and_type.css">
  <link rel="stylesheet" href="../../design-systems/t1/ui_kit/components.css">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"     crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"     crossorigin="anonymous"></script>

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    p, h1, h2, h3 { margin: 0; padding: 0; }
    button { cursor: pointer; border: none; background: none; padding: 0; }
    #root  { height: 100%; }
    body   { font-family: "Proxima Nova", sans-serif; }

    /* ═══════════════════════════════════════════════
       TEKION SHELL  (ts-* prefix)
    ═══════════════════════════════════════════════ */
    .ts-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Menubar (64px dark top bar) ── */
    .ts-menubar { height: 64px; background: #3f4757; display: flex; align-items: center; flex-shrink: 0; }
    .ts-menubar__main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 24px; height: 64px; padding: 0 16px; }
    .ts-menubar__nav  { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }

    .ts-icon-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 2px; flex-shrink: 0; color: rgba(255,255,255,0.75); padding: 4px; transition: background 0.12s, color 0.12s; }
    .ts-icon-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .ts-wordmark { font-weight: 600; font-size: 15px; letter-spacing: 0.1em; color: #25c8a5; flex-shrink: 0; line-height: 16px; display: flex; align-items: center; gap: 6px; }
    .ts-wordmark__product-logo { width: 16px; height: 16px; }

    .ts-menubar__search { flex: 1; min-width: 0; display: flex; justify-content: flex-end; max-width: 688px; overflow: hidden; border-radius: 2px; isolation: isolate; }
    .ts-search-field  { flex: 1; display: flex; align-items: center; gap: 8px; background: #fff; height: 32px; padding: 4px 8px; }
    .ts-search-field__placeholder { font-size: 14px; line-height: 16px; color: #969aa3; flex: 1; min-width: 0; }

    .ts-menubar__actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .ts-split-btn       { display: flex; align-items: flex-start; gap: 1px; flex-shrink: 0; }
    .ts-split-btn__text { display: flex; align-items: center; justify-content: center; background: #152532; height: 32px; padding: 4px 16px 4px 12px; border-radius: 2px 0 0 2px; }
    .ts-split-btn__text-inner { display: flex; align-items: center; gap: 8px; }
    .ts-split-btn__label { font-weight: 600; font-size: 14px; line-height: 16px; color: #fff; white-space: nowrap; }
    .ts-split-btn__caret { display: flex; align-items: center; justify-content: center; background: #152532; width: 32px; height: 32px; border-radius: 0 2px 2px 0; padding: 4px; }

    /* ── Workspace section (right of menubar) ── */
    .ts-workspace         { width: 296px; height: 100%; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-left: 1px solid #152532; }
    .ts-workspace__avatar { width: 40px; height: 40px; border-radius: 4px; background: #6285a3; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 8px; overflow: hidden; }
    .ts-workspace__info   { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .ts-workspace__name   { font-weight: 600; font-size: 16px; line-height: 16px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ts-workspace__site   { font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.8); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ts-workspace__chevron { flex-shrink: 0; color: rgba(255,255,255,0.75); display: flex; align-items: center; }

    /* ── Body ── */
    .ts-body { flex: 1; display: flex; overflow: hidden; }

    /* ── Favbar (64px left sidebar) ── */
    .ts-favbar        { width: 64px; background: #3f4757; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
    .ts-favbar__scroll{ flex: 1; display: flex; flex-direction: column; align-items: center; width: 100%; overflow: hidden; }

    .ts-ai-tile         { position: relative; width: 64px; height: 72px; flex-shrink: 0; cursor: pointer; }
    .ts-ai-tile__bg     { position: absolute; top: 0; left: 0; width: 64px; height: 139px; background: #3f4757; }
    .ts-ai-tile__inner  { position: absolute; left: 12px; top: 16px; width: 40px; height: 40px; border-radius: 6px; background: linear-gradient(-44.623deg,#2157f5 2.9%,#258dff 40.7%,#86ffbb 106.9%); display: flex; align-items: center; justify-content: center; overflow: hidden; transition: opacity 0.15s; }
    .ts-ai-tile:hover .ts-ai-tile__inner { opacity: 0.85; }

    .ts-app-tile        { position: relative; width: 64px; height: 64px; flex-shrink: 0; cursor: pointer; }
    .ts-app-tile--tall  { height: 72px; }
    .ts-app-tile__btn   { position: absolute; left: 12px; top: 12px; width: 40px; height: 36px; background: #6f7884; border-radius: 2px 2px 0 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .ts-app-tile--tall .ts-app-tile__btn { top: 8px; }
    .ts-app-tile__abbr  { font-weight: 600; font-size: 16px; line-height: 16px; color: #fff; white-space: nowrap; }
    .ts-app-tile__indicator { position: absolute; left: 12px; top: 48px; width: 40px; height: 4px; border-radius: 0 0 2px 2px; }
    .ts-app-tile--tall .ts-app-tile__indicator { top: 44px; }
    .ts-app-tile__label { position: absolute; left: 50%; top: 60px; transform: translateX(-50%) translateY(-50%); font-weight: 600; font-size: 12px; color: #fff; text-align: center; width: 64px; white-space: nowrap; }
    .ts-ind--red    { background: #fae3e1; }
    .ts-ind--teal   { background: #dcfaf6; }
    .ts-ind--green  { background: #e1faf0; }
    .ts-ind--purple { background: #e6e1f5; }
    .ts-ind--orange { background: #fff3e0; }

    .ts-favbar__bottom         { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; width: 100%; }
    .ts-favbar__bottom-section { border-top: 1px solid #152532; border-bottom: 1px solid #152532; padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
    .ts-favbar__avatar         { width: 40px; height: 40px; border-radius: 1000px; background: #edeef0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .ts-favbar__avatar-text    { font-weight: 600; font-size: 15px; line-height: 18px; color: #6d707a; text-align: center; }
    .ts-favbar__time-row       { padding: 4px; display: flex; align-items: center; justify-content: center; width: 100%; }
    .ts-favbar__time-text      { font-weight: 600; font-size: 12px; line-height: 16px; color: #fff; white-space: nowrap; }

    /* ── Main content area ── */
    .ts-main       { flex: 1; min-width: 0; background: #f4f5f6; position: relative; overflow: hidden; }
    .ts-main__inner{ position: absolute; inset: 0; background: #fff; overflow: hidden; display: flex; flex-direction: row; }

    /* ── CRM skeleton ── */
    .ts-crm       { flex: 1; min-width: 0; position: relative; overflow: hidden; background: #fff; }
    .ts-page-nav  { position: absolute; left: 0; right: 0; top: 0; height: 56px; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; padding: 0 24px 1px; }
    .ts-page-nav__bar { background: #f1f5f9; height: 16px; width: 200px; border-radius: 4px; flex-shrink: 0; }
    .ts-action-bar{ position: absolute; left: 0; right: 0; top: 56px; display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; }
    .ts-filter-group { display: flex; gap: 12px; align-items: center; }
    .ts-filter-pill  { background: #f1f5f9; height: 32px; width: 80px; border-radius: 6px; flex-shrink: 0; }
    .ts-search-box   { background: #f1f5f9; height: 32px; width: 240px; border-radius: 6px; flex-shrink: 0; }
    .ts-table-wrap   { position: absolute; left: 0; right: 0; top: 104px; bottom: 48px; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px 8px 0 0; overflow-x: auto; overflow-y: auto; }
    .ts-table        { min-width: 1100px; width: max-content; }
    .ts-row--header  { background: #f8fafc; border-bottom: 1px solid #e2e8f0; height: 40px; display: flex; align-items: center; gap: 16px; padding: 0 16px 1px; }
    .ts-row          { background: #fff; border-bottom: 1px solid #f1f5f9; height: 36px; display: flex; align-items: center; gap: 16px; padding: 0 16px 1px; }
    .ts-row:last-child { border-bottom: none; }
    .ts-cell         { display: flex; align-items: center; flex-shrink: 0; }
    .ts-cell--name   { width: 260px; gap: 12px; }
    .ts-cell--col2, .ts-cell--col3, .ts-cell--col4 { width: 287px; }
    .ts-cell--status { width: 120px; }
    .ts-cell--action { width: 80px; }
    .ts-bar          { background: #e2e8f0; height: 10px; border-radius: 4px; flex-shrink: 0; }
    .ts-bar--sm      { background: #f1f5f9; height: 8px; border-radius: 4px; flex-shrink: 0; }
    .ts-circle       { background: #f1f5f9; width: 20px; height: 20px; border-radius: 10px; flex-shrink: 0; }
    .ts-pagination   { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
    .ts-pagination__info { background: #f1f5f9; height: 16px; width: 120px; border-radius: 4px; }
    .ts-pagination__btns { display: flex; gap: 4px; align-items: center; }
    .ts-page-btn     { width: 28px; height: 28px; background: #f1f5f9; border-radius: 4px; flex-shrink: 0; }

    /* ═══════════════════════════════════════════════
       AI PANEL  (ts-ai-* prefix)
    ═══════════════════════════════════════════════ */
    .ts-ai-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #ffffff;
      transition: width 0.25s ease, height 0.25s ease;
    }

    /* ── closed ── */
    .ts-ai--closed .ts-ai-panel { display: none; }

    /* ── left-docked (panel left, CRM right) ── */
    .ts-ai--left .ts-ai-panel { width: 400px; flex-shrink: 0; border-right: 1px solid #d4d5d6; }
    .ts-ai--left .ts-crm      { order: 2; }
    .ts-ai--left .ts-ai-panel { order: 1; }

    /* ── right-docked (CRM left, panel right) ── */
    .ts-ai--right .ts-ai-panel { width: 400px; flex-shrink: 0; border-left: 1px solid #d4d5d6; }
    .ts-ai--right .ts-crm     { order: 1; }
    .ts-ai--right .ts-ai-panel{ order: 2; }

    /* ── fullscreen ── */
    .ts-ai--fullscreen .ts-crm      { display: none; }
    .ts-ai--fullscreen .ts-ai-panel { flex: 1; min-width: 0; }
    .ts-ai--fullscreen .ts-ai-panel .t1-ab { border-radius: 0 !important; }

    /* ── Panel open animation — slides up from bottom ── */
    @keyframes ts-panel-open {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* ── popover (floating above content) ── */
    .ts-ai--popover .ts-crm { flex: 1; }
    .ts-ai--popover .ts-ai-panel {
      position: absolute;
      left: 24px;
      top: 26.9%;
      bottom: 0;
      width: 400px;
      z-index: 10;
      border: 1px solid #d4d5d6;
      box-shadow: 0 8px 24px rgba(25,40,57,0.12);
      border-radius: 8px 8px 0 0;
      animation: ts-panel-open 0.38s cubic-bezier(0.32, 0.72, 0, 1) both;
    }

    /* ── minimized (44px strip at bottom) ── */
    .ts-ai--minimized .ts-crm { flex: 1; }
    .ts-ai--minimized .ts-ai-panel {
      position: absolute;
      left: 24px;
      bottom: 0;
      width: 400px;
      height: 44px;
      z-index: 10;
      border: 1px solid #d4d5d6;
      box-shadow: 0 -8px 24px rgba(25,40,57,0.12);
      border-radius: 8px 8px 0 0;
    }
    .ts-ai--minimized .ts-ai-panel__body { display: none; }

    /* AppBar corner overrides per state */
    .ts-ai--left  .ts-ai-panel .t1-ab,
    .ts-ai--right .ts-ai-panel .t1-ab { border-radius: 0 !important; }
    .ts-ai--popover   .ts-ai-panel .t1-ab,
    .ts-ai--minimized .ts-ai-panel .t1-ab { border-radius: 8px 8px 0 0 !important; }

    /* ── Panel body ── */
    .ts-ai-panel__body {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
      position: relative; /* contains drawer so it never overlaps AppBar */
    }

    /* ── Fullscreen sidebar (SideNavigation) ── */
    .ts-ai-sidebar {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid #e2e8f0;
    }
    .ts-ai-sidebar .t1-sn { flex: 1; min-height: 0; border-right: none; width: 100%; }
    .ts-ai--fullscreen .ts-ai-panel__body .t1-sn { width: 280px; flex-shrink: 0; min-height: 0; }

    .ts-ai-settings { flex-shrink: 0; padding: 8px 16px 12px; border-top: 1px solid #e8e9eb; width: 280px; }
    .ts-ai-settings .t1-btn { width: 100%; justify-content: flex-start; }

    /* ── Sidenav drawer keyframes ── */
    @keyframes ts-sidenav-backdrop-in  { from { background: rgba(25,40,57,0);    } to { background: rgba(25,40,57,0.35); } }
    @keyframes ts-sidenav-backdrop-out { from { background: rgba(25,40,57,0.35); } to { background: rgba(25,40,57,0);    } }
    @keyframes ts-sidenav-panel-in  { from { transform: translateX(-100%); } to { transform: translateX(0);    } }
    @keyframes ts-sidenav-panel-out { from { transform: translateX(0);    } to { transform: translateX(-100%); } }

    /* ── Sidenav drawer (hamburger toggle in non-fullscreen states) ── */
    .ts-ai-sidenav-drawer {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      animation: ts-sidenav-backdrop-in 0.3s ease both;
    }
    .ts-ai-sidenav-drawer.is-closing {
      animation: ts-sidenav-backdrop-out 0.22s ease both;
      pointer-events: none;
    }
    .ts-ai-sidenav-drawer__panel {
      width: 280px;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 2px 0 12px rgba(25,40,57,0.1);
      animation: ts-sidenav-panel-in 0.32s cubic-bezier(0.32, 0.72, 0, 1) both;
    }
    .ts-ai-sidenav-drawer.is-closing .ts-ai-sidenav-drawer__panel {
      animation: ts-sidenav-panel-out 0.22s ease both;
    }
    .ts-ai-sidenav-drawer__panel .t1-sn { flex: 1; min-height: 0; border-right: none; width: 100%; }
    .ts-ai-sidenav-drawer__settings { flex-shrink: 0; padding: 8px 16px 12px; border-top: 1px solid #e8e9eb; }
    .ts-ai-sidenav-drawer__settings .t1-btn { width: 100%; justify-content: flex-start; }

    /* ── Chat content column ── */
    .ts-ai-panel__chat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    /* ── Thread ── */
    .ts-ai-thread {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
    }
    .ts-ai-thread .t1-chat__row--assistant { flex-direction: column; }
    .ts-ai-thread .t1-chat__row--assistant > .t1-response { flex: initial; width: 100%; }

    /* ── Welcome state ── */
    .ts-ai-welcome {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      padding: 24px 0 0;
      gap: 16px;
    }
    .ts-ai-welcome .t1-wlc,
    .ts-ai-welcome .t1-sug { width: 100%; }

    /* ── PromptInput wrapper ── */
    .ts-ai-input { flex-shrink: 0; padding: 16px; }

    /* Fullscreen: center at max 820px */
    .ts-ai--fullscreen .ts-ai-thread { padding: 0 0 16px; align-items: center; }
    .ts-ai--fullscreen .ts-ai-thread > * { width: 100%; max-width: 820px; }
    .ts-ai--fullscreen .ts-ai-input {
      padding: 16px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .ts-ai--fullscreen .ts-ai-input > .t1-pi { width: 100%; max-width: 820px; }
    .ts-ai--fullscreen .ts-ai-disclaimer { width: 100%; max-width: 820px; }

    /* ── Disclaimer ── */
    .ts-ai-disclaimer {
      font-size: 11px;
      font-weight: 400;
      color: #969aa3;
      text-align: center;
      padding-top: 6px;
    }

    /* ── ListingCard: narrow container overrides ── */
    .ts-ai--popover .t1-lc__item,
    .ts-ai--left    .t1-lc__item,
    .ts-ai--right   .t1-lc__item { padding: 12px; }
    .ts-ai--popover .t1-lc__body,
    .ts-ai--left    .t1-lc__body,
    .ts-ai--right   .t1-lc__body { flex-wrap: wrap; align-items: flex-start; }
    .ts-ai--popover .t1-lc__info,
    .ts-ai--left    .t1-lc__info,
    .ts-ai--right   .t1-lc__info { width: 100%; }
    .ts-ai--popover .t1-lc__suffix,
    .ts-ai--left    .t1-lc__suffix,
    .ts-ai--right   .t1-lc__suffix { flex-direction: row; align-items: center; justify-content: flex-start; gap: 8px; width: 100%; min-width: 0; }
    .ts-ai--popover .t1-lc__suffix-label,
    .ts-ai--popover .t1-lc__suffix-detail,
    .ts-ai--left    .t1-lc__suffix-label,
    .ts-ai--left    .t1-lc__suffix-detail,
    .ts-ai--right   .t1-lc__suffix-label,
    .ts-ai--right   .t1-lc__suffix-detail { text-align: left; white-space: normal; padding: 0; }
    .ts-ai--popover .t1-lc__suffix-label::after,
    .ts-ai--left    .t1-lc__suffix-label::after,
    .ts-ai--right   .t1-lc__suffix-label::after { content:'·'; margin-left:8px; color:#b4b6bb; }
    .ts-ai--popover .t1-lc__title, .ts-ai--popover .t1-lc__sub, .ts-ai--popover .t1-lc__desc,
    .ts-ai--left    .t1-lc__title, .ts-ai--left    .t1-lc__sub, .ts-ai--left    .t1-lc__desc,
    .ts-ai--right   .t1-lc__title, .ts-ai--right   .t1-lc__sub, .ts-ai--right   .t1-lc__desc { white-space: normal; word-break: break-word; }
    .ts-ai--popover .t1-lc__nameid,
    .ts-ai--left    .t1-lc__nameid,
    .ts-ai--right   .t1-lc__nameid { flex-wrap: wrap; }

    /* ── Streaming cursor ── */
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
    .ts-ai-cursor { display:inline-block; width:2px; height:13px; background:#4285f4; margin-left:1px; vertical-align:middle; border-radius:1px; animation:blink 0.9s ease-in-out infinite; }

    /* ── Message row fade-in — user bubbles only ── */
    /* Assistant rows must NOT animate-in: the ReasoningLog was already visible
       during the turn, and replaying opacity-0 would cause a flash on commit. */
    @keyframes t1-msg-in { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    .t1-chat__row--user { animation: t1-msg-in 0.18s ease; }

    /* ── Lazy-load: response sections reveal after streaming completes ── */
    /* Fires once when each element enters the DOM (committed message).    */
    @keyframes t1-lazy-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0);   }
    }
    /* Ordered / unordered list items — stagger 80 ms per item */
    .t1-chat__row--assistant .t1-response__list li {

       letter <Avatar> in .t1-lc__avatar; the kit is read-only, so we paint the

    /* ── Streaming helper ────────────────────────────────────────────── */
    /* Updates DOM directly via ref — no React re-renders per character.   */
    const streamRef      = { current: null };
    const scrollTimerRef = { current: null };

    /* Soft-scroll el to its bottom. */
    function softScrollToBottom(el) {
      el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
    }

    /* True when the user hasn't scrolled more than 120 px above the bottom.
       Guards the auto-scroll so users can freely read older messages. */
    function isNearBottom(el) {
      return el.scrollHeight - el.scrollTop - el.clientHeight < 120;
    }

    function streamText(full, bodyRef, threadEl, onDone) {
      let i = 0;
      /* Initial kick — content is about to grow */
      if (threadEl) softScrollToBottom(threadEl);
      /* Keep following the bottom every 200 ms; throttled to avoid
         conflicting smooth-scroll animations in the browser. */
      scrollTimerRef.current = threadEl
        ? setInterval(() => {
            if (isNearBottom(threadEl)) softScrollToBottom(threadEl);
          }, 200)
        : null;

      function tick() {
        if (i < full.length) {
          i = Math.min(i + 1, full.length);
          if (bodyRef.current) bodyRef.current.textContent = full.slice(0, i);
          streamRef.current = requestAnimationFrame(tick);
        } else {
          clearInterval(scrollTimerRef.current);
          scrollTimerRef.current = null;
          if (threadEl) softScrollToBottom(threadEl);
          onDone();
        }
      }
      streamRef.current = requestAnimationFrame(tick);
    }

    /* ═══════════════════════════════════════════════════════════════════
       CHAT APP — root component
    ═══════════════════════════════════════════════════════════════════ */
    function ChatApp() {
      /* Panel state: 'closed'|'popover'|'left'|'right'|'fullscreen'|'minimized' */
      const [panelState,  setPanelState]  = useState((new URLSearchParams(window.location.search).get('panel')) || 'popover'); /* ?panel=popover|left|right|fullscreen for review */
      const [panelLeft,   setPanelLeft]   = useState(null); /* px — X-only drag */
      const prevStateRef                  = useRef('popover');
      const dragRef                       = useRef(null);

      /* Chat state */
      /* Seeded scenarios — choose via ?scenario=match|empty (default match).
         Lets each spec state be reviewed in isolation without disturbing the others. */
      const SCENARIO = (new URLSearchParams(window.location.search).get('scenario')) || 'match';
      const SEEDS = {
        match: [
          { id: 1, role: 'user', content: 'find me a Toyota Camry from my inventory' },
          { id: 2, role: 'assistant', userText: 'find me a Toyota Camry from my inventory', ...RESPONSES.vehicleSearch },
        ],
        empty: [
          { id: 1, role: 'user', content: 'find me a Toyota Supra from my inventory' },
          { id: 2, role: 'assistant', userText: 'find me a Toyota Supra from my inventory', ...RESPONSES.vehicleSearchEmpty },
        ],
        /* Step 5: frozen 'searching' turn — user message only, phase starts at
           'thinking' (see below) so the ReasoningLog shows in-progress and no card. */
        loading: [
          { id: 1, role: 'user', content: 'find me a Toyota Camry from my inventory' },
        ],
        error: [
          { id: 1, role: 'user', content: 'find me a Toyota Camry from my inventory' },
          { id: 2, role: 'assistant', userText: 'find me a Toyota Camry from my inventory', ...RESPONSES.vehicleSearchError },
        ],
      };
      const seedMsgs = SEEDS[SCENARIO] || SEEDS.match;
      const [messages,    setMessages]    = useState(seedMsgs);
      const [chatTitle,   setChatTitle]   = useState(seedMsgs[0].content.slice(0, 40));
      const [phase,       setPhase]       = useState(SCENARIO === 'loading' ? 'thinking' : 'idle');
      const [pendingMeta, setPendingMeta] = useState(SCENARIO === 'loading' ? RESPONSES.vehicleSearch : null);
      const [sideSearch,  setSideSearch]  = useState('');

      /* 4 randomly chosen suggestions — re-picked on every new chat */
      const [activeSuggestions, setActiveSuggestions] = useState(pickSuggestions);

      /* Nav variant — 'home' | 'tasks' — drives NavBar appearance */
      const [navVariant,  setNavVariant]  = useState('home');
      /* Sidenav drawer open in non-fullscreen panel states */
      const [sideNavOpen,    setSideNavOpen]    = useState(false);
      const [sideNavClosing, setSideNavClosing] = useState(false);

      function closeSideNav() {
        setSideNavClosing(true);
        setTimeout(() => {
          setSideNavOpen(false);
          setSideNavClosing(false);
        }, 220);
      }

      const threadRef       = useRef(null);
      const streamBodyRef   = useRef(null);
      const thinkTimer      = useRef(null);
      const thoughtTimer    = useRef(null);
      const msgIdRef        = useRef(2); /* seeded messages use ids 1 (user) & 2 (assistant) */
      /* Holds stream args until the streaming DOM has been committed by React */
      const pendingStreamRef = useRef(null);

      /* Auto-scroll on message/phase changes — soft so the eye follows. */
      useEffect(() => {
        if (threadRef.current) softScrollToBottom(threadRef.current);
      }, [messages, phase]);

      /* Start streaming AFTER React has committed the streaming-phase DOM so
         streamBodyRef.current is guaranteed to be set before the first tick. */
      useEffect(() => {
        if (phase !== 'streaming' || !pendingStreamRef.current) return;
        const { body, onDone } = pendingStreamRef.current;
        pendingStreamRef.current = null;
        streamText(body, streamBodyRef, threadRef.current, onDone);
      }, [phase]); // eslint-disable-line react-hooks/exhaustive-deps

      /* Cleanup timers on unmount */
      useEffect(() => () => {
        clearTimeout(thinkTimer.current);
        clearTimeout(thoughtTimer.current);
        cancelAnimationFrame(streamRef.current);
        clearInterval(scrollTimerRef.current);
      }, []);

      /* ── State machine ── */
      function goToState(next) {
        if (panelState !== 'minimized' && panelState !== 'fullscreen' && panelState !== 'closed') {
          prevStateRef.current = panelState;
        }
        setPanelLeft(null);
        setPanelState(next);
      }

      /* ── Drag — X-axis only; panel stays bottom-anchored ── */
      function handleAppBarDragStart(e) {
        if (panelState !== 'popover' && panelState !== 'minimized') return;
        e.preventDefault();
        const panel = e.currentTarget.closest('.ts-ai-panel');
        if (!panel) return;
        const rect = panel.getBoundingClientRect();
        dragRef.current = { offsetX: e.clientX - rect.left };
        const onMove = (ev) => {
          const maxLeft = window.innerWidth - rect.width;
          const x = Math.min(Math.max(0, ev.clientX - dragRef.current.offsetX), maxLeft);
          setPanelLeft(x);
        };
        const onUp = () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup',   onUp);
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup',   onUp);
      }

      /* ── Chat handlers ── */
      function handleSend(text) {
        if (!text || !text.trim() || phase !== 'idle') return;
        if (panelState === 'closed') setPanelState('popover');
        const response = matchResponse(text);
        const uid = ++msgIdRef.current;
        if (messages.length === 0) setChatTitle(text.trim().slice(0, 40));
        setMessages(prev => [...prev, { id:uid, role:'user', content:text.trim() }]);
        setPendingMeta(response);
        setPhase('thinking');
        /* Wait for typewriter to finish all steps (65 ms/char) + 400 ms buffer */
        const totalTypingMs = response.steps.reduce((acc, s) => acc + s.length * 65, 0);
        thinkTimer.current = setTimeout(() => {
          setPhase('thought');
          thoughtTimer.current = setTimeout(() => {
            pendingStreamRef.current = {
              body: response.body,
              onDone: () => {
                const aid = ++msgIdRef.current;
                setMessages(prev => [...prev, { id:aid, role:'assistant', userText: text.trim(), ...response }]);
                setPhase('idle');
                setPendingMeta(null);
              },
            };
            setPhase('streaming');
          }, 400);
        }, Math.max(3000, totalTypingMs + 400));
      }

      /* Edit an existing user message in-place and regenerate the AI response.
         - Updates the user bubble text to newText
         - Drops all messages that came after it (the old AI response)
         - Streams a fresh AI response without appending another user message */
      function handleEditAndResend(msgId, newText) {
        const trimmed = newText.trim();
        if (!trimmed || phase !== 'idle') return;

        const response = matchResponse(trimmed);
        const msgIdx = messages.findIndex(m => m.id === msgId);

        /* Replace the edited message, discard everything after it */
        setMessages(prev => [
          ...prev.slice(0, msgIdx),
          { ...prev[msgIdx], content: trimmed },
        ]);

        setPendingMeta(response);
        setPhase('thinking');

        clearTimeout(thinkTimer.current);
        clearTimeout(thoughtTimer.current);
        cancelAnimationFrame(streamRef.current);
        clearInterval(scrollTimerRef.current);

        /* Wait for typewriter to finish all steps (65 ms/char) + 400 ms buffer */
        const totalTypingMs = response.steps.reduce((acc, s) => acc + s.length * 65, 0);
        thinkTimer.current = setTimeout(() => {
          setPhase('thought');
          thoughtTimer.current = setTimeout(() => {
            pendingStreamRef.current = {
              body: response.body,
              onDone: () => {
                const aid = ++msgIdRef.current;
                setMessages(prev => [...prev, { id: aid, role: 'assistant', userText: trimmed, ...response }]);
                setPhase('idle');
                setPendingMeta(null);
              },
            };
            setPhase('streaming');
          }, 400);
        }, Math.max(3000, totalTypingMs + 400));
      }

      function handleNewChat() {
        clearTimeout(thinkTimer.current);
        clearTimeout(thoughtTimer.current);
        cancelAnimationFrame(streamRef.current);
        clearInterval(scrollTimerRef.current);
        setMessages([]);
        setChatTitle('Title');
        setPhase('idle');
        setPendingMeta(null);
        setNavVariant('home');
        setSideNavOpen(false);
        setSideNavClosing(false);
        setActiveSuggestions(pickSuggestions());
        if (panelState === 'closed') setPanelState('popover');
      }

      function handleNewTask() {
        clearTimeout(thinkTimer.current);
        clearTimeout(thoughtTimer.current);
        cancelAnimationFrame(streamRef.current);
        clearInterval(scrollTimerRef.current);
        setMessages([]);
        setChatTitle('New Task');
        setPhase('idle');
        setPendingMeta(null);
        setNavVariant('tasks');
        setSideNavOpen(false);
        setSideNavClosing(false);
        if (panelState === 'closed') setPanelState('popover');
      }

      function handleChatSelect(item) {
        handleNewChat();
        setChatTitle(item.label);
      }

      /* ── AppBar type + orientation (Figma 1:1 mapping) ──
         popover  → stickyMaximized (drag grip + menu: L / R / Full)
         left     → panel orientation=right  (menu: R / Full / Pop Out)
         right    → panel orientation=left   (menu: L / Full / Pop Out)
         fullscreen → fullscreen             (menu: L / R / Pop Out)
         minimized → stickyMinimized         (caret-up + close, no menu)
      */
      const appBarType =
        panelState === 'fullscreen' ? 'fullscreen'      :
        panelState === 'minimized'  ? 'stickyMinimized' :
        panelState === 'popover'    ? 'stickyMaximized' :
                                      'panel';
      const appBarOrientation = panelState === 'left' ? 'right' : 'left';

      const showWelcome = messages.length === 0 && phase === 'idle';

      /* ── Render ── */
      return (
        <div className="ts-shell">

                  </svg>

                      title="AI Assistant"
                      onMinimize={() => { prevStateRef.current = panelState; goToState('minimized'); }}
                      onCollapse={() => goToState(prevStateRef.current || 'popover')}
                      onMove={(target) => goToState(target)}
                      onDragStart={handleAppBarDragStart}
                      onClose={()  => setPanelState('closed')}
                    />

                    {/* Panel body (hidden in minimized state via CSS) */}
                    <div className="ts-ai-panel__body">

                      {/* SideNavigation — fullscreen only */}
                      {panelState === 'fullscreen' && (() => {
                        const q = sideSearch.toLowerCase();
                        const filteredPinned = q
                          ? PINNED_CHATS.filter(c => c.label.toLowerCase().includes(q))
                          : PINNED_CHATS;
                        const filteredRecent = q
                          ? RECENT_CHATS.filter(c => c.label.toLowerCase().includes(q))
                          : RECENT_CHATS;
                        return (
                        <div className="ts-ai-sidebar">
                          <SideNavigation
                            scheduledTask={true}
                            sections="Expanded"
                            task="Default"
                            activeNav={navVariant === 'tasks' ? 'tasks' : 'home'}
                            searchValue={sideSearch}
                            onSearch={setSideSearch}
                            pinnedChats={filteredPinned}
                            recentTasks={RECENT_TASKS}
                            recentChats={filteredRecent}
                            onNewChat={handleNewChat}
                            onChatSelect={handleChatSelect}
                            onNavSelect={({ id }) => setNavVariant(id === 'tasks' ? 'tasks' : 'home')}
                            onViewAllPinned={() => console.log('view all pinned')}
                            onViewAllTasks={() => console.log('view all tasks')}
                          />
                          <div className="ts-ai-settings">
                            <Button variant="text" color="neutral" size="md" iconStart="gear">Settings</Button>
                          </div>
                        </div>
                        );
                      })()}

                      {/* Sidenav drawer — hamburger toggle for popover / docked states */}
                      {sideNavOpen && panelState !== 'fullscreen' && (
                        <div
                          className={`ts-ai-sidenav-drawer${sideNavClosing ? ' is-closing' : ''}`}
                          onClick={closeSideNav}
                        >
                          <div className="ts-ai-sidenav-drawer__panel" onClick={e => e.stopPropagation()}>
                            <SideNavigation
                              scheduledTask={true}
                              sections="Expanded"
                              task="Default"
                              activeNav={navVariant === 'tasks' ? 'tasks' : 'home'}
                              searchValue={sideSearch}
                              onSearch={setSideSearch}
                              pinnedChats={PINNED_CHATS}
                              recentTasks={RECENT_TASKS}
                              recentChats={RECENT_CHATS}
                              onNewChat={() => handleNewChat()}
                              onChatSelect={(c) => { handleChatSelect(c); closeSideNav(); }}
                              onNavSelect={({ id }) => {
                                setNavVariant(id === 'tasks' ? 'tasks' : 'home');
                                closeSideNav();
                              }}
                              onViewAllPinned={() => console.log('view all pinned')}
                              onViewAllTasks={() => console.log('view all tasks')}
                            />
                            <div className="ts-ai-sidenav-drawer__settings">
                              <Button variant="text" color="neutral" size="md" iconStart="gear">Settings</Button>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* Chat column */}
                      <div className="ts-ai-panel__chat">

                        {/* NavBar — hamburger only in narrow panel states (not fullscreen) */}
                        {navVariant === 'tasks' ? (
                          <NavBar
                            title="Tasks"
                            onMenuClick={panelState !== 'fullscreen' ? () => sideNavOpen ? closeSideNav() : setSideNavOpen(true) : undefined}
                            actionLabel="New task"
                            actionIcon="plus"
                            onAction={handleNewTask}
                          />
                        ) : (
                          <NavBar
                            title={chatTitle}
                            onMenuClick={panelState !== 'fullscreen' ? () => sideNavOpen ? closeSideNav() : setSideNavOpen(true) : undefined}
                            showNewChat
                            onNewChat={handleNewChat}
                            showMore
                            onMore={() => console.log('more')}
                          />
                        )}

                        {/* Thread */}
                        <div className="ts-ai-thread" ref={threadRef}>
                          {showWelcome ? (
                            <div className="ts-ai-welcome">
                              <Welcome
                                name="Sarah"
                                description="Your AI-powered sales assistant. Ask me about deals, leads, pipeline, or drafts."
                              />
                              <SuggestionList
                                items={navVariant === 'tasks' ? TASK_SUGGESTIONS : activeSuggestions}
                                onSelect={item => handleSend(item.label)}
                              />
                            </div>
                          ) : (
                            <div className="t1-chat">
                              {messages.map(msg =>
                                msg.role === 'user' ? (
                                  <div key={msg.id} className="t1-chat__row t1-chat__row--user">
                                    <ChatBubble
                                      onEdit={(newText) => handleEditAndResend(msg.id, newText)}
                                    >{msg.content}</ChatBubble>
                                  </div>
                                ) : (
                                  <div key={msg.id} className="t1-chat__row t1-chat__row--assistant">
                                    {msg.steps && msg.steps.length > 0 && (
                                      <ReasoningLog inProgress={false} interrupted={false} steps={msg.steps}/>
                                    )}
                                    <Response
                                      title={msg.title}
                                      orderedList={msg.orderedList}
                                      unorderedList={msg.unorderedList}
                                      contentSlot={renderSlot(msg)}
                                      filterCount={msg.filterCount}
                                      sourceCount={msg.sourceCount}
                                      showFilter={!!msg.filterCount}
                                      showSource={!!msg.sourceCount}
                                      filterItems={msg.filterItems}
                                      sourceItems={msg.sourceItems}
                                      onRegenerate={msg.userText ? () => handleSend(msg.userText) : undefined}
                                      showFeedback={!(msg.suggestions && msg.suggestions.length)}
                                    >
                                      {msg.body}
                                    </Response>
                                    {msg.suggestions && msg.suggestions.length > 0 && (
                                      <div className="veh-empty-suggestions">
                                        <SuggestionList
                                          items={msg.suggestions}
                                          onSelect={item => handleSend(item.label)}
                                        />
                                      </div>
                                    )}
                                  </div>
                                )
                              )}
                              {(phase === 'thinking' || phase === 'thought' || phase === 'streaming') && pendingMeta && (
                                <div className="t1-chat__row t1-chat__row--assistant">
                                  {/* ReasoningLog stays mounted through ALL three phases —
                                      never unmounts so it never flashes off/on screen. */}
                                  <ReasoningLog
                                    inProgress={phase === 'thinking'}
                                    interrupted={false}
                                    steps={pendingMeta.steps}
                                  />
                                  {phase === 'streaming' && (
                                    <Response
                                      title={pendingMeta.title}
                                      filterCount={pendingMeta.filterCount}
                                      sourceCount={pendingMeta.sourceCount}
                                      showFilter={false}
                                      showSource={false}
                                      showFeedback={false}
                                    >
                                      <span ref={streamBodyRef} /><span className="ts-ai-cursor" aria-hidden="true"/>
                                    </Response>
                                  )}
                                </div>
                              )}
                            </div>
                          )}
                        </div>

                        {/* PromptInput */}
                        <div className="ts-ai-input">
                          <PromptInput
                            onSend={handleSend}
                            loading={phase !== 'idle'}
                            disabled={phase !== 'idle'}
                            placeholder='Ask anything or press "/" for shortcuts'
                          />
                          <p className="ts-ai-disclaimer">AI Assistant can make mistakes, so please verify responses.</p>
                        </div>

                      </div>{/* /ts-ai-panel__chat */}
                    </div>{/* /ts-ai-panel__body */}

                  </div>
                )}{/* /ts-ai-panel */}

              </div>{/* /ts-main__inner */}
            </div>{/* /ts-main */}

          </div>{/* /ts-body */}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ChatApp/>);
  });
  </script>
</body>
</html>
