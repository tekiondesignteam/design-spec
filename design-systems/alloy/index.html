<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRP Design System — GM Core Components</title>
  <!-- FOUC guard for data-brand. Must stay in sync with src/context/brand-constants.ts:
       storage key = 'drp-brand'
       allowlist   = ['chevrolet','buick','gmc','cadillac'] -->
  <script>(function(){var b;try{b=localStorage.getItem('drp-brand')}catch(e){}if(b&&['chevrolet','buick','gmc','cadillac'].indexOf(b)!==-1){document.documentElement.dataset.brand=b}})();</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
