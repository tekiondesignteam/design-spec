<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dropdown · T1 UI Kit</title>
  <link rel="stylesheet" href="../../../colors_and_type.css">
  <link rel="stylesheet" href="../../kit.css">
  <link rel="stylesheet" href="../../components.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #F5F7F9; }
    body { padding: 48px; min-height: 100vh; font-family: var(--t1-font-sans); }
    .preview-head { font-size: 12px; letter-spacing: 0.04em; color: var(--t1-fg-muted); text-transform: uppercase; margin-bottom: 16px; font-weight: 600; }
    .preview-title { font-size: 20px; font-weight: 700; color: var(--t1-fg); margin-bottom: 40px; }
    .preview-grid { display: flex; flex-direction: column; gap: 40px; }
    .preview-group { display: flex; flex-direction: column; gap: 8px; }
    .preview-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--t1-fg-muted); }
    .preview-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  </style>
</head>
<body>
  <div class="preview-head">T1 UI Kit · preview</div>
  <div class="preview-title">Dropdown</div>
  <div id="root"></div>
  <script src="../../components/manifest.js"></script>
  <script src="../../loader.js" data-base="../../"></script>
  <script type="text/babel">
    (function waitForComponents() {
      if (!window.Dropdown) { setTimeout(waitForComponents, 50); return; }

      const STAGES    = ['Prospect', 'Contacted', 'Qualified', 'Proposal Sent', 'Negotiating', 'Closed Won', 'Closed Lost'];
      const ASSIGNEES = ['Alice Johnson', 'Bob Smith', 'Carlos Rivera', 'Diana Park', 'Ethan Moore'];

      function Demo() {
        return (
          <div className="preview-grid">

            <div className="preview-group">
              <div className="preview-label">Basic — click to open, select to close</div>
              <div className="preview-row">
                <Dropdown placeholder="Select stage" items={STAGES} width={220} />
                <Dropdown placeholder="Assign to" items={ASSIGNEES} width={220} />
              </div>
            </div>

            <div className="preview-group">
              <div className="preview-label">With search — type to filter</div>
              <div className="preview-row">
                <Dropdown placeholder="Select stage" items={STAGES} search width={220} />
                <Dropdown placeholder="Assign to" items={ASSIGNEES} search width={220} />
              </div>
            </div>

            <div className="preview-group">
              <div className="preview-label">Header + description + search</div>
              <Dropdown
                placeholder="Select a deal stage"
                header
                title="Deal Stage"
                description="Select the current stage of this deal"
                search
                items={STAGES}
                width={280}
              />
            </div>

            <div className="preview-group">
              <div className="preview-label">With dividers</div>
              <Dropdown placeholder="Select stage" items={STAGES} dividers width={220} />
            </div>

            <div className="preview-group">
              <div className="preview-label">Grouped sections + search</div>
              <Dropdown
                placeholder="Select assignee"
                search
                sections={[
                  { label: 'Sales', items: ['Alice Johnson', 'Bob Smith'] },
                  { label: 'Pre-Sales', items: ['Carlos Rivera', 'Diana Park'] },
                  { label: 'Management', items: ['Ethan Moore', 'Fiona Walsh'] },
                ]}
                width={240}
              />
            </div>

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    })();
  </script>
</body>
</html>
