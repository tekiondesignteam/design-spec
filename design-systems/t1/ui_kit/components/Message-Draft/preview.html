<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Message-Draft · T1 UI Kit</title>
  <link rel="stylesheet" href="../../../colors_and_type.css">
  <link rel="stylesheet" href="../../kit.css">
  <link rel="stylesheet" href="../../components.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #F5F7F9; }
    body { padding: 48px; min-height: 100vh; font-family: var(--t1-font-sans); }
    .preview-head  { font-size: 12px; letter-spacing: 0.04em; color: var(--t1-fg-muted); text-transform: uppercase; margin-bottom: 16px; font-weight: 600; }
    .preview-title { font-size: 20px; font-weight: 700; color: var(--t1-fg); margin-bottom: 32px; }
    .section-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--t1-fg-muted); margin-bottom: 12px;
    }
    .preview-row   { margin-bottom: 48px; }
    .states-grid   { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
    .state-col     { display: flex; flex-direction: column; gap: 8px; }
    .state-tag     { font-size: 10px; font-weight: 600; text-transform: uppercase;
                     letter-spacing: 0.05em; color: var(--t1-fg-muted); }
  </style>
</head>
<body>
  <div class="preview-head">T1 UI Kit · preview</div>
  <div class="preview-title">Message-Draft</div>
  <div id="root"></div>
  <script src="../../components/manifest.js"></script>
  <script src="../../loader.js" data-base="../../"></script>
  <script type="text/babel">
    (function waitForComponents() {
      if (!window.MessageDraft) { setTimeout(waitForComponents, 50); return; }

      /* Static forced-state cards for the state showcase */
      const ForcedDraft = ({ forceStatus, label }) => {
        const ref = React.useRef(null);
        React.useEffect(() => {
          if (!ref.current) return;
          ref.current.className = ref.current.className
            .replace(/t1-md--\S+/g, '').trim();
          if (forceStatus && forceStatus !== 'idle') {
            ref.current.className += ` t1-md--${forceStatus}`;
          }
        }, [forceStatus]);
        return (
          <div className="state-col">
            <div className="state-tag">{label}</div>
            <MessageDraft ref={ref} />
          </div>
        );
      };

      const Demo = () => (
        <div>

          {/* ── Interactive (live) ── */}
          <div className="preview-row">
            <div className="section-label">
              Interactive — click content area to activate, then click Send
            </div>
            <MessageDraft />
          </div>

          {/* ── All 6 Figma states side by side ── */}
          <div className="preview-row">
            <div className="section-label">All states (Figma reference)</div>
            <div className="states-grid">

              {/* Default */}
              <div className="state-col">
                <div className="state-tag">Default</div>
                <div className="t1-md">
                  <div className="t1-md__card">
                    <div className="t1-md__main">
                      <div className="t1-md__to-row">
                        <span className="t1-md__to-label">To:</span>
                        <Chip variant="outlined" color="neutral" size="md">Flora Fleisher</Chip>
                      </div>
                      <Separator />
                      <div className="t1-md__content">
                        <div className="t1-md__text">{'Hi Flora,\n\nGreat speaking with you! I have you down for Tuesday at 10 AM to drive the 2023 AeroVibe.\n\nSee you then!\nDean'.split('\n').map((l,i,a) => <React.Fragment key={i}>{l}{i<a.length-1&&<br/>}</React.Fragment>)}</div>
                      </div>
                    </div>
                    <Button size="md" variant="contained" color="primary">Send</Button>
                  </div>
                  <div className="t1-md__note">Note: Once you send this message, it cannot be undone.</div>
                </div>
              </div>

              {/* Hover */}
              <div className="state-col">
                <div className="state-tag">Hover</div>
                <div className="t1-md">
                  <div className="t1-md__card">
                    <div className="t1-md__main">
                      <div className="t1-md__to-row">
                        <span className="t1-md__to-label">To:</span>
                        <Chip variant="outlined" color="neutral" size="md">Flora Fleisher</Chip>
                      </div>
                      <Separator />
                      <div className="t1-md__content" style={{background:'var(--t1-neutral-100)',border:'1px dashed var(--t1-neutral-200)'}}>
                        <div className="t1-md__text">{'Hi Flora,\n\nGreat speaking with you! I have you down for Tuesday at 10 AM to drive the 2023 AeroVibe.\n\nSee you then!\nDean'.split('\n').map((l,i,a) => <React.Fragment key={i}>{l}{i<a.length-1&&<br/>}</React.Fragment>)}</div>
                      </div>
                    </div>
                    <Button size="md" variant="contained" color="primary">Send</Button>
                  </div>
                  <div className="t1-md__note">Note: Once you send this message, it cannot be undone.</div>
                </div>
              </div>

              {/* Active */}
              <div className="state-col">
                <div className="state-tag">Active</div>
                <div className="t1-md t1-md--active">
                  <div className="t1-md__card">
                    <div className="t1-md__main">
                      <div className="t1-md__to-row">
                        <span className="t1-md__to-label">To:</span>
                        <Chip variant="outlined" color="neutral" size="md">Flora Fleisher</Chip>
                      </div>
                      <Separator />
                      <div className="t1-md__content">
                        <div className="t1-md__text">{'Hi Flora,\n\nGreat speaking with you! I have you down for Tuesday at 10 AM to drive the 2023 AeroVibe.\n\nSee you then!\nDean'.split('\n').map((l,i,a) => <React.Fragment key={i}>{l}{i<a.length-1&&<br/>}</React.Fragment>)}</div>
                      </div>
                    </div>
                    <Button size="md" variant="contained" color="primary">Send</Button>
                  </div>
                  <div className="t1-md__note">Note: Once you send this message, it cannot be undone.</div>
                </div>
              </div>

              {/* Sending */}
              <div className="state-col">
                <div className="state-tag">Sending</div>
                <div className="t1-md t1-md--sending">
                  <div className="t1-md__card">
                    <div className="t1-md__main">
                      <div className="t1-md__to-row">
                        <span className="t1-md__to-label">To:</span>
                        <Chip variant="outlined" color="neutral" size="md">Flora Fleisher</Chip>
                      </div>
                      <Separator />
                      <div className="t1-md__content">
                        <div className="t1-md__text">{'Hi Flora,\n\nGreat speaking with you! I have you down for Tuesday at 10 AM to drive the 2023 AeroVibe.\n\nSee you then!\nDean'.split('\n').map((l,i,a) => <React.Fragment key={i}>{l}{i<a.length-1&&<br/>}</React.Fragment>)}</div>
                      </div>
                    </div>
                    <Button size="md" variant="outlined" color="neutral" disabled iconEnd={<i className="ph ph-circle-notch t1-md__spinner" />}>Sending...</Button>
                  </div>
                  <div className="t1-md__note">Note: Once you send this message, it cannot be undone.</div>
                </div>
              </div>

              {/* Success */}
              <div className="state-col">
                <div className="state-tag">Success</div>
                <div className="t1-md t1-md--success">
                  <div className="t1-md__card">
                    <div className="t1-md__main">
                      <div className="t1-md__to-row">
                        <span className="t1-md__to-label">To:</span>
                        <Chip variant="outlined" color="neutral" size="md">Flora Fleisher</Chip>
                      </div>
                      <Separator />
                      <div className="t1-md__content">
                        <div className="t1-md__text">{'Hi Flora,\n\nGreat speaking with you! I have you down for Tuesday at 10 AM to drive the 2023 AeroVibe.\n\nSee you then!\nDean'.split('\n').map((l,i,a) => <React.Fragment key={i}>{l}{i<a.length-1&&<br/>}</React.Fragment>)}</div>
                        <div className="t1-md__alert t1-md__alert--success">
                          <i className="ph-fill ph-check-circle t1-md__alert-icon" />
                          <span className="t1-md__alert-text">Text successfully sent to Flora Fleisher</span>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div className="t1-md__note">Note: Once you send this message, it cannot be undone.</div>
                </div>
              </div>

              {/* Error */}
              <div className="state-col">
                <div className="state-tag">Error</div>
                <div className="t1-md t1-md--error">
                  <div className="t1-md__card">
                    <div className="t1-md__main">
                      <div className="t1-md__to-row">
                        <span className="t1-md__to-label">To:</span>
                        <Chip variant="outlined" color="neutral" size="md">Flora Fleisher</Chip>
                      </div>
                      <Separator />
                      <div className="t1-md__content">
                        <div className="t1-md__text">{'Hi Flora,\n\nGreat speaking with you! I have you down for Tuesday at 10 AM to drive the 2023 AeroVibe.\n\nSee you then!\nDean'.split('\n').map((l,i,a) => <React.Fragment key={i}>{l}{i<a.length-1&&<br/>}</React.Fragment>)}</div>
                        <div className="t1-md__alert t1-md__alert--error">
                          <i className="ph-fill ph-x-circle t1-md__alert-icon" />
                          <span className="t1-md__alert-text">Could not be sent due to technical error</span>
                        </div>
                      </div>
                    </div>
                    <Button size="md" variant="contained" color="primary">Try Again</Button>
                  </div>
                  <div className="t1-md__note">Note: Once you send this message, it cannot be undone.</div>
                </div>
              </div>

            </div>
          </div>

        </div>
      );

      ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    })();
  </script>
</body>
</html>
