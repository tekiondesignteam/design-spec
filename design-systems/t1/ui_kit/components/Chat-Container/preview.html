<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chat-Container · T1 UI Kit</title>
  <link rel="stylesheet" href="../../../colors_and_type.css">
  <link rel="stylesheet" href="../../kit.css">
  <link rel="stylesheet" href="../../components.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #F5F7F9; }
    body { padding: 48px; min-height: 100vh; font-family: var(--t1-font-sans); }
    .preview-head  { font-size: 12px; letter-spacing: 0.04em; color: var(--t1-fg-muted); text-transform: uppercase; margin-bottom: 16px; font-weight: 600; }
    .preview-title { font-size: 20px; font-weight: 700; color: var(--t1-fg); margin-bottom: 32px; }
    .preview-stage { display: block; max-width: 760px; }
    .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--t1-fg-muted); margin-bottom: 12px; }
    .preview-row   { margin-bottom: 48px; }
  </style>
</head>
<body>
  <div class="preview-head">T1 UI Kit · preview</div>
  <div class="preview-title">Chat-Container</div>
  <div id="root" class="preview-stage"></div>
  <script src="../../components/manifest.js"></script>
  <script src="../../loader.js" data-base="../../"></script>
  <script type="text/babel">
    (function waitForComponents() {
      if (!window.ChatContainer) { setTimeout(waitForComponents, 50); return; }

      const Demo = () => (
        <div>

          {/* ── messages-array mode ── */}
          <div className="preview-row">
            <div className="section-label">messages prop (structured)</div>
            <ChatContainer messages={[
              { role: 'user',      content: 'Who are my hot leads today?' },
              { role: 'assistant', content: 'Based on engagement score and deal stage, here are your top 3 leads for today.' },
              { role: 'user',      content: "Can you show me Sarah Chen's deal details?" },
              { role: 'assistant', content: 'Sarah Chen is interested in a 2024 Honda Accord EX. She responded positively to the financing terms you sent last Tuesday. Her deal score is 94 — highest in your pipeline.' },
            ]} />
          </div>

          {/* ── children passthrough mode ── */}
          <div className="preview-row">
            <div className="section-label">children passthrough (auto role-detection)</div>
            <ChatContainer>
              <ChatBubble role="user">What's the status of my open deals?</ChatBubble>
              <ChatBubble role="assistant">You have 12 open deals totaling $840K. 3 are in the final negotiation stage.</ChatBubble>
              <ChatBubble role="user">Which ones need follow-up this week?</ChatBubble>
              <ChatBubble role="assistant">Focus on Johnson Family Motors (expires Friday), Westside Auto Group (waiting on trade-in appraisal), and Peak Motors (pending finance approval).</ChatBubble>
            </ChatContainer>
          </div>

        </div>
      );

      ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    })();
  </script>
</body>
</html>
