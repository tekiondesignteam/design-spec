<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Progress-Bar · T1 UI Kit</title>
  <link rel="stylesheet" href="../../../colors_and_type.css">
  <link rel="stylesheet" href="../../kit.css">
  <link rel="stylesheet" href="../../components.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #F5F7F9; }
    body { padding: 48px; min-height: 100vh; font-family: var(--t1-font-sans); }
    .preview-head  { font-size: 12px; letter-spacing: 0.04em; color: var(--t1-fg-muted); text-transform: uppercase; margin-bottom: 16px; font-weight: 600; }
    .preview-title { font-size: 20px; font-weight: 700; color: var(--t1-fg); margin-bottom: 32px; }
    .section-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--t1-fg-muted); margin-bottom: 12px;
    }
    .preview-row   { margin-bottom: 40px; max-width: 400px; }

    /* Slider control */
    .slider-wrap {
      display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    }
    .slider-wrap input[type=range] {
      flex: 1; -webkit-appearance: none; height: 4px;
      border-radius: 9999px; background: var(--t1-neutral-200); outline: none; cursor: pointer;
    }
    .slider-wrap input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: var(--t1-blue-400); cursor: pointer; border: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .slider-val {
      font-size: 13px; font-weight: 600; color: var(--t1-fg); min-width: 36px; text-align: right;
    }
  </style>
</head>
<body>
  <div class="preview-head">T1 UI Kit · preview</div>
  <div class="preview-title">Progress-Bar</div>
  <div id="root"></div>
  <script src="../../components/manifest.js"></script>
  <script src="../../loader.js" data-base="../../"></script>
  <script type="text/babel">
    (function waitForComponents() {
      if (!window.ProgressBar) { setTimeout(waitForComponents, 50); return; }

      const Demo = () => {
        const [val, setVal] = React.useState(35);

        return (
          <div>

            {/* ── Interactive slider ── */}
            <div className="preview-row">
              <div className="section-label">Interactive — drag to adjust</div>
              <div className="slider-wrap">
                <input
                  type="range" min={0} max={100} value={val}
                  onChange={e => setVal(Number(e.target.value))}
                />
                <span className="slider-val">{val}%</span>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
                <ProgressBar value={val} label="Upload progress" color="brand" />
                <ProgressBar value={val} label="Tasks completed" color="success" />
              </div>
            </div>

            {/* ── Static values — Brand ── */}
            <div className="preview-row">
              <div className="section-label">Brand — 0 / 25 / 50 / 75 / 100</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                <ProgressBar value={0}   label="Label" color="brand" />
                <ProgressBar value={25}  label="Label" color="brand" />
                <ProgressBar value={50}  label="Label" color="brand" />
                <ProgressBar value={75}  label="Label" color="brand" />
                <ProgressBar value={100} label="Label" color="brand" />
              </div>
            </div>

            {/* ── Static values — Success ── */}
            <div className="preview-row">
              <div className="section-label">Success — 0 / 25 / 50 / 75 / 100</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                <ProgressBar value={0}   label="Label" color="success" />
                <ProgressBar value={25}  label="Label" color="success" />
                <ProgressBar value={50}  label="Label" color="success" />
                <ProgressBar value={75}  label="Label" color="success" />
                <ProgressBar value={100} label="Label" color="success" />
              </div>
            </div>

            {/* ── No label ── */}
            <div className="preview-row">
              <div className="section-label">Without label</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                <ProgressBar value={val} color="brand" />
                <ProgressBar value={val} color="success" />
              </div>
            </div>

            {/* ── Indeterminate ── */}
            <div className="preview-row">
              <div className="section-label">Indeterminate</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                <ProgressBar determinate={false} color="brand" />
                <ProgressBar determinate={false} color="success" />
              </div>
            </div>

          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    })();
  </script>
</body>
</html>
