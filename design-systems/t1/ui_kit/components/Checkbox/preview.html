<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Checkbox · T1 UI Kit</title>
  <link rel="stylesheet" href="../../../colors_and_type.css">
  <link rel="stylesheet" href="../../kit.css">
  <link rel="stylesheet" href="../../components.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #F5F7F9; }
    body { padding: 48px; min-height: 100vh; font-family: var(--t1-font-sans); }
    .preview-head  { font-size: 12px; letter-spacing: 0.04em; color: var(--t1-fg-muted); text-transform: uppercase; margin-bottom: 16px; font-weight: 600; }
    .preview-title { font-size: 20px; font-weight: 700; color: var(--t1-fg); margin-bottom: 32px; }
    .section-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--t1-fg-muted); margin-bottom: 12px;
    }
    .preview-row   { margin-bottom: 40px; }
    .chk-grid {
      display: grid;
      grid-template-columns: repeat(4, auto);
      gap: 16px 32px;
      align-items: center;
      justify-items: start;
    }
    .col-head {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--t1-fg-muted);
    }
  </style>
</head>
<body>
  <div class="preview-head">T1 UI Kit · preview</div>
  <div class="preview-title">Checkbox</div>
  <div id="root"></div>
  <script src="../../components/manifest.js"></script>
  <script src="../../loader.js" data-base="../../"></script>
  <script type="text/babel">
    (function waitForComponents() {
      if (!window.Checkbox) { setTimeout(waitForComponents, 50); return; }

      const Demo = () => (
        <div>

          {/* ── Brand / Square ── */}
          <div className="preview-row">
            <div className="section-label">Brand · Square</div>
            <div className="chk-grid">
              <span className="col-head">Default</span>
              <span className="col-head">Hover</span>
              <span className="col-head">Active</span>
              <span className="col-head">Disabled</span>

              {/* unchecked row */}
              <Checkbox />
              <Checkbox state="hover" />
              <Checkbox state="active" />
              <Checkbox disabled />

              {/* checked row */}
              <Checkbox checked />
              <Checkbox checked state="hover" />
              <Checkbox checked state="active" />
              <Checkbox checked disabled />

              {/* indeterminate row */}
              <Checkbox indeterminate />
              <Checkbox indeterminate state="hover" />
              <Checkbox indeterminate state="active" />
              <Checkbox indeterminate disabled />
            </div>
          </div>

          {/* ── Brand / Circle ── */}
          <div className="preview-row">
            <div className="section-label">Brand · Circle</div>
            <div className="chk-grid">
              <span className="col-head">Default</span>
              <span className="col-head">Hover</span>
              <span className="col-head">Active</span>
              <span className="col-head">Disabled</span>

              <Checkbox shape="circle" />
              <Checkbox shape="circle" state="hover" />
              <Checkbox shape="circle" state="active" />
              <Checkbox shape="circle" disabled />

              <Checkbox shape="circle" checked />
              <Checkbox shape="circle" checked state="hover" />
              <Checkbox shape="circle" checked state="active" />
              <Checkbox shape="circle" checked disabled />

              <Checkbox shape="circle" indeterminate />
              <Checkbox shape="circle" indeterminate state="hover" />
              <Checkbox shape="circle" indeterminate state="active" />
              <Checkbox shape="circle" indeterminate disabled />
            </div>
          </div>

          {/* ── Success / Square (no indeterminate — not in Figma) ── */}
          <div className="preview-row">
            <div className="section-label">Success · Square</div>
            <div className="chk-grid">
              <span className="col-head">Default</span>
              <span className="col-head">Hover</span>
              <span className="col-head">Active</span>
              <span className="col-head">Disabled</span>

              <Checkbox color="success" />
              <Checkbox color="success" state="hover" />
              <Checkbox color="success" state="active" />
              <Checkbox color="success" disabled />

              <Checkbox color="success" checked />
              <Checkbox color="success" checked state="hover" />
              <Checkbox color="success" checked state="active" />
              <Checkbox color="success" checked disabled />
            </div>
          </div>

          {/* ── With Labels ── */}
          <div className="preview-row">
            <div className="section-label">With Labels</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              <Checkbox label="Unchecked" />
              <Checkbox label="Checked" checked />
              <Checkbox label="Indeterminate" indeterminate />
              <Checkbox label="Disabled unchecked" disabled />
              <Checkbox label="Disabled checked" checked disabled />
              <Checkbox
                label="With description"
                description="Additional context about this option"
                checked
              />
              <Checkbox
                color="success"
                label="Success checked"
                description="This action has been completed"
                checked
              />
              <Checkbox
                color="success"
                label="Success disabled"
                checked
                disabled
              />
            </div>
          </div>

          {/* ── Interactive ── */}
          <div className="preview-row">
            <div className="section-label">Interactive</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              <Checkbox label="Click to toggle (brand square)" shape="square" color="brand" />
              <Checkbox label="Click to toggle (brand circle)" shape="circle" color="brand" />
              <Checkbox label="Click to toggle (success)" color="success" />
            </div>
          </div>

        </div>
      );

      ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    })();
  </script>
</body>
</html>
