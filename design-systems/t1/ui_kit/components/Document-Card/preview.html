<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Document-Card · T1 UI Kit</title>
  <link rel="stylesheet" href="../../../colors_and_type.css">
  <link rel="stylesheet" href="../../kit.css">
  <link rel="stylesheet" href="../../components.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #F5F7F9; }
    body { padding: 48px; min-height: 100vh; font-family: var(--t1-font-sans); }
    .preview-head  { font-size: 12px; letter-spacing: 0.04em; color: var(--t1-fg-muted); text-transform: uppercase; margin-bottom: 16px; font-weight: 600; }
    .preview-title { font-size: 20px; font-weight: 700; color: var(--t1-fg); margin-bottom: 32px; }
    .preview-stage { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
    .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--t1-fg-muted); margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="preview-head">T1 UI Kit · preview</div>
  <div class="preview-title">Document Card</div>
  <div id="root" class="preview-stage"></div>
  <script src="../../components/manifest.js"></script>
  <script src="../../loader.js" data-base="../../"></script>
  <script type="text/babel">
    (function waitForComponents() {
      if (!window.DocumentCard) { setTimeout(waitForComponents, 50); return; }

      const Demo = () => (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 24, alignItems: 'flex-start' }}>

          {/* Default — mirrors Figma exactly */}
          <div>
            <div className="section-label">Default (Figma)</div>
            <DocumentCard />
          </div>

          {/* Document reference */}
          <div>
            <div className="section-label">Document reference</div>
            <DocumentCard
              title="Vehicle Inspection Report"
              icon="file-text"
              subtitles={['PDF', '2.4 MB', 'Updated today']}
              links={[
                { label: 'View', href: '#' },
                { label: 'Download', href: '#' },
              ]}
            />
          </div>

          {/* Contract */}
          <div>
            <div className="section-label">Contract</div>
            <DocumentCard
              title="Sales Agreement — DEAL-10042"
              icon="file-doc"
              subtitles={['DOCX', 'Draft', 'Awaiting signature']}
              links={[
                { label: 'Open', href: '#' },
                { label: 'Sign', href: '#' },
              ]}
            />
          </div>

          {/* Image / photo */}
          <div>
            <div className="section-label">Photo attachment</div>
            <DocumentCard
              title="Trade-In Vehicle Photos"
              icon="image"
              subtitles={['JPG', '18 photos', 'Mar 12, 2025']}
              links={[
                { label: 'Preview', href: '#' },
              ]}
            />
          </div>

          {/* No subtitles */}
          <div>
            <div className="section-label">No subtitles</div>
            <DocumentCard
              title="Proof of Insurance"
              icon="shield-check"
              subtitles={[]}
              links={[
                { label: 'View', href: '#' },
                { label: 'Replace', href: '#' },
              ]}
            />
          </div>

        </div>
      );

      ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    })();
  </script>
</body>
</html>
