<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Avatar · T1 UI Kit</title>
  <link rel="stylesheet" href="../../../colors_and_type.css">
  <link rel="stylesheet" href="../../kit.css">
  <link rel="stylesheet" href="../../components.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #F5F7F9; }
    body { padding: 48px; min-height: 100vh; font-family: var(--t1-font-sans); }
    .preview-head  { font-size: 12px; letter-spacing: 0.04em; color: var(--t1-fg-muted); text-transform: uppercase; margin-bottom: 16px; font-weight: 600; }
    .preview-title { font-size: 20px; font-weight: 700; color: var(--t1-fg); margin-bottom: 32px; }
    .preview-stage { display: block; max-width: 760px; }
    .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--t1-fg-muted); margin-bottom: 16px; }
    .preview-row   { margin-bottom: 48px; }
    .av-row        { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
    .size-label    { font-size: 10px; color: var(--t1-fg-muted); width: 28px; flex-shrink: 0; }
    .col-divider   { width: 1px; height: 48px; background: var(--t1-border); margin: 0 8px; }
  </style>
</head>
<body>
  <div class="preview-head">T1 UI Kit · preview</div>
  <div class="preview-title">Avatar</div>
  <div id="root" class="preview-stage"></div>
  <script src="../../components/manifest.js"></script>
  <script src="../../loader.js" data-base="../../"></script>
  <script type="text/babel">
    (function waitForComponents() {
      if (!window.Avatar) { setTimeout(waitForComponents, 50); return; }

      /* Sample image — deterministic face from DiceBear */
      const PHOTO = 'https://api.dicebear.com/7.x/personas/svg?seed=tekion&backgroundColor=b6e3f4';

      const SIZES = ['lg', 'md', 'sm', '2xs'];

      const Row = ({ type, variant, src, initials }) => (
        <div className="av-row">
          {SIZES.map(size => (
            <Avatar key={size} type={type} variant={variant} size={size}
              src={src} initials={initials} />
          ))}
        </div>
      );

      const Demo = () => (
        <div>

          {/* ── Icon type ── */}
          <div className="preview-row">
            <div className="section-label">Icon — Rounded</div>
            <Row type="icon" variant="rounded" />
            <div className="section-label" style={{marginTop:24}}>Icon — Square</div>
            <Row type="icon" variant="square" />
          </div>

          {/* ── Letter type ── */}
          <div className="preview-row">
            <div className="section-label">Letter — Rounded</div>
            <Row type="letter" variant="rounded" initials="XD" />
            <div className="section-label" style={{marginTop:24}}>Letter — Square</div>
            <Row type="letter" variant="square" initials="XD" />
          </div>

          {/* ── Image type ── */}
          <div className="preview-row">
            <div className="section-label">Image — Rounded</div>
            <Row type="image" variant="rounded" src={PHOTO} />
            <div className="section-label" style={{marginTop:24}}>Image — Square</div>
            <Row type="image" variant="square" src={PHOTO} />
          </div>

        </div>
      );

      ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    })();
  </script>
</body>
</html>
