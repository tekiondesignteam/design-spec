<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Planner-Card · T1 UI Kit</title>
  <link rel="stylesheet" href="../../../colors_and_type.css">
  <link rel="stylesheet" href="../../kit.css">
  <link rel="stylesheet" href="../../components.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #F5F7F9; }
    body { padding: 48px; min-height: 100vh; font-family: var(--t1-font-sans); }
    .preview-head  { font-size: 12px; letter-spacing: 0.04em; color: var(--t1-fg-muted); text-transform: uppercase; margin-bottom: 16px; font-weight: 600; }
    .preview-title { font-size: 20px; font-weight: 700; color: var(--t1-fg); margin-bottom: 32px; }
    .section-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--t1-fg-muted); margin-bottom: 12px;
    }
    .preview-row { margin-bottom: 48px; }
  </style>
</head>
<body>
  <div class="preview-head">T1 UI Kit · preview</div>
  <div class="preview-title">Planner-Card</div>
  <div id="root"></div>
  <script src="../../components/manifest.js"></script>
  <script src="../../loader.js" data-base="../../"></script>
  <script type="text/babel">
    (function waitForComponents() {
      if (!window.PlannerCard) { setTimeout(waitForComponents, 50); return; }

      /* ── All-checked data for completed variant ── */
      const completedLists = [
        {
          label: '1. List',
          items: [
            { text: 'Select Customer',        checked: true },
            { text: 'Draft follow-up SMS',     checked: true },
            { text: 'Check inventory status',  checked: true },
            { text: 'Schedule test drive',     checked: true },
            { text: 'Send calendar invite',    checked: true },
          ],
        },
        {
          label: '2. List',
          items: [
            { text: 'Prepare trade-in quote',   checked: true },
            { text: 'Run credit pre-check',     checked: true },
            { text: 'Review financing options',  checked: true },
            { text: 'Confirm delivery date',     checked: true },
            { text: 'Schedule follow-up call',   checked: true },
          ],
        },
      ];

      const Demo = () => (
        <div>

          {/* ── Default / in-progress (interactive) ── */}
          <div className="preview-row">
            <div className="section-label">Default — in progress (click checkboxes to toggle)</div>
            <PlannerCard />
          </div>

          {/* ── Completed ── */}
          <div className="preview-row">
            <div className="section-label">Completed — all items checked</div>
            <PlannerCard
              title="Flora Fleisher: Action Plan"
              lists={completedLists}
            />
          </div>

          {/* ── Single list ── */}
          <div className="preview-row">
            <div className="section-label">Single list — no separator</div>
            <PlannerCard
              title="Quick Follow-up"
              lists={[
                {
                  label: '1. List',
                  items: [
                    { text: 'Call customer',        checked: true  },
                    { text: 'Send quote via email', checked: false },
                    { text: 'Log in CRM',           checked: false },
                  ],
                },
              ]}
            />
          </div>

        </div>
      );

      ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    })();
  </script>
</body>
</html>
