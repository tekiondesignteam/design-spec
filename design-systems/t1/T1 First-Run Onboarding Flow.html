<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T1 AI Sales Assistant</title>

  <!-- Fonts — fork lives at project root, so paths are root-relative. -->
  <style>
    @font-face { font-family:"Proxima Nova"; font-weight:300; src:url("fonts/Proxima-Nova-Light.otf")   format("opentype"); font-display:swap; }
    @font-face { font-family:"Proxima Nova"; font-weight:400; src:url("fonts/Proxima-Nova-Regular.otf") format("opentype"); font-display:swap; }
    @font-face { font-family:"Proxima Nova"; font-weight:500; src:url("fonts/Proxima-Nova-Medium.otf")  format("opentype"); font-display:swap; }
    @font-face { font-family:"Proxima Nova"; font-weight:600; src:url("fonts/Proxima-Nova-Semibold.otf")format("opentype"); font-display:swap; }
  </style>

  <!-- Kit CSS — root-relative for the fork -->
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="ui_kit/components.css">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"     crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"     crossorigin="anonymous"></script>

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    p, h1, h2, h3 { margin: 0; padding: 0; }
    button { cursor: pointer; border: none; background: none; padding: 0; }
    #root  { height: 100%; }
    body   { font-family: "Proxima Nova", sans-serif; }

    /* ═══════════════════════════════════════════════
       TEKION SHELL  (ts-* prefix)
    ═══════════════════════════════════════════════ */
    .ts-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── Menubar (64px dark top bar) ── */
    .ts-menubar { height: 64px; background: #3f4757; display: flex; align-items: center; flex-shrink: 0; }
    .ts-menubar__main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 24px; height: 64px; padding: 0 16px; }
    .ts-menubar__nav  { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }

    .ts-icon-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 2px; flex-shrink: 0; color: rgba(255,255,255,0.75); padding: 4px; transition: background 0.12s, color 0.12s; }
    .ts-icon-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .ts-wordmark { font-weight: 600; font-size: 15px; letter-spacing: 0.1em; color: #25c8a5; flex-shrink: 0; line-height: 16px; display: flex; align-items: center; gap: 6px; }
    .ts-wordmark__product-logo { width: 16px; height: 16px; }

    .ts-menubar__search { flex: 1; min-width: 0; display: flex; justify-content: flex-end; max-width: 688px; overflow: hidden; border-radius: 2px; isolation: isolate; }
    .ts-search-field  { flex: 1; display: flex; align-items: center; gap: 8px; background: #fff; height: 32px; padding: 4px 8px; }
    .ts-search-field__placeholder { font-size: 14px; line-height: 16px; color: #969aa3; flex: 1; min-width: 0; }

    .ts-menubar__actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .ts-split-btn       { display: flex; align-items: flex-start; gap: 1px; flex-shrink: 0; }
    .ts-split-btn__text { display: flex; align-items: center; justify-content: center; background: #152532; height: 32px; padding: 4px 16px 4px 12px; border-radius: 2px 0 0 2px; }
    .ts-split-btn__text-inner { display: flex; align-items: center; gap: 8px; }
    .ts-split-btn__label { font-weight: 600; font-size: 14px; line-height: 16px; color: #fff; white-space: nowrap; }
    .ts-split-btn__caret { display: flex; align-items: center; justify-content: center; background: #152532; width: 32px; height: 32px; border-radius: 0 2px 2px 0; padding: 4px; }

    /* ── Workspace section (right of menubar) ── */
    .ts-workspace         { width: 296px; height: 100%; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-left: 1px solid #152532; }
    .ts-workspace__avatar { width: 40px; height: 40px; border-radius: 4px; background: #6285a3; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 8px; overflow: hidden; }
    .ts-workspace__info   { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .ts-workspace__name   { font-weight: 600; font-size: 16px; line-height: 16px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ts-workspace__site   { font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.8); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ts-workspace__chevron { flex-shrink: 0; color: rgba(255,255,255,0.75); display: flex; align-items: center; }

    /* ── Body ── */
    .ts-body { flex: 1; display: flex; overflow: hidden; }

    /* ── Favbar (64px left sidebar) ── */
    .ts-favbar        { width: 64px; background: #3f4757; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
    .ts-favbar__scroll{ flex: 1; display: flex; flex-direction: column; align-items: center; width: 100%; overflow: hidden; }

    .ts-ai-tile         { position: relative; width: 64px; height: 72px; flex-shrink: 0; cursor: pointer; }
    .ts-ai-tile__bg     { position: absolute; top: 0; left: 0; width: 64px; height: 139px; background: #3f4757; }
    .ts-ai-tile__inner  { position: absolute; left: 12px; top: 16px; width: 40px; height: 40px; border-radius: 6px; background: linear-gradient(-44.623deg,#2157f5 2.9%,#258dff 40.7%,#86ffbb 106.9%); display: flex; align-items: center; justify-content: center; overflow: hidden; transition: opacity 0.15s; }
    .ts-ai-tile:hover .ts-ai-tile__inner { opacity: 0.85; }

    .ts-app-tile        { position: relative; width: 64px; height: 64px; flex-shrink: 0; cursor: pointer; }
    .ts-app-tile--tall  { height: 72px; }
    .ts-app-tile__btn   { position: absolute; left: 12px; top: 12px; width: 40px; height: 36px; background: #6f7884; border-radius: 2px 2px 0 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .ts-app-tile--tall .ts-app-tile__btn { top: 8px; }
    .ts-app-tile__abbr  { font-weight: 600; font-size: 16px; line-height: 16px; color: #fff; white-space: nowrap; }
    .ts-app-tile__indicator { position: absolute; left: 12px; top: 48px; width: 40px; height: 4px; border-radius: 0 0 2px 2px; }
    .ts-app-tile--tall .ts-app-tile__indicator { top: 44px; }
    .ts-app-tile__label { position: absolute; left: 50%; top: 60px; transform: translateX(-50%) translateY(-50%); font-weight: 600; font-size: 12px; color: #fff; text-align: center; width: 64px; white-space: nowrap; }
    .ts-ind--red    { background: #fae3e1; }
    .ts-ind--teal   { background: #dcfaf6; }
    .ts-ind--green  { background: #e1faf0; }
    .ts-ind--purple { background: #e6e1f5; }
    .ts-ind--orange { background: #fff3e0; }

    .ts-favbar__bottom         { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; width: 100%; }
    .ts-favbar__bottom-section { border-top: 1px solid #152532; border-bottom: 1px solid #152532; padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
    .ts-favbar__avatar         { width: 40px; height: 40px; border-radius: 1000px; background: #edeef0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .ts-favbar__avatar-text    { font-weight: 600; font-size: 15px; line-height: 18px; color: #6d707a; text-align: center; }
    .ts-favbar__time-row       { padding: 4px; display: flex; align-items: center; justify-content: center; width: 100%; }
    .ts-favbar__time-text      { font-weight: 600; font-size: 12px; line-height: 16px; color: #fff; white-space: nowrap; }

    /* ── Main content area ── */
    .ts-main       { flex: 1; min-width: 0; background: #f4f5f6; position: relative; overflow: hidden; }
    .ts-main__inner{ position: absolute; inset: 0; background: #fff; overflow: hidden; display: flex; flex-direction: row; }

    /* ── CRM skeleton ── */
    .ts-crm       { flex: 1; min-width: 0; position: relative; overflow: hidden; background: #fff; }
    .ts-page-nav  { position: absolute; left: 0; right: 0; top: 0; height: 56px; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; padding: 0 24px 1px; }
    .ts-page-nav__bar { background: #f1f5f9; height: 16px; width: 200px; border-radius: 4px; flex-shrink: 0; }
    .ts-action-bar{ position: absolute; left: 0; right: 0; top: 56px; display: flex; align-items: center; justify-content: space-between; padding: 8px 4px; }
    .ts-filter-group { display: flex; gap: 12px; align-items: center; }
    .ts-filter-pill  { background: #f1f5f9; height: 32px; width: 80px; border-radius: 6px; flex-shrink: 0; }
    .ts-search-box   { background: #f1f5f9; height: 32px; width: 240px; border-radius: 6px; flex-shrink: 0; }
    .ts-table-wrap   { position: absolute; left: 0; right: 0; top: 104px; bottom: 48px; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px 8px 0 0; overflow-x: auto; overflow-y: auto; }
    .ts-table        { min-width: 1100px; width: max-content; }
    .ts-row--header  { background: #f8fafc; border-bottom: 1px solid #e2e8f0; height: 40px; display: flex; align-items: center; gap: 16px; padding: 0 16px 1px; }
    .ts-row          { background: #fff; border-bottom: 1px solid #f1f5f9; height: 36px; display: flex; align-items: center; gap: 16px; padding: 0 16px 1px; }
    .ts-row:last-child { border-bottom: none; }
    .ts-cell         { display: flex; align-items: center; flex-shrink: 0; }
    .ts-cell--name   { width: 260px; gap: 12px; }
    .ts-cell--col2, .ts-cell--col3, .ts-cell--col4 { width: 287px; }
    .ts-cell--status { width: 120px; }
    .ts-cell--action { width: 80px; }
    .ts-bar          { background: #e2e8f0; height: 10px; border-radius: 4px; flex-shrink: 0; }
    .ts-bar--sm      { background: #f1f5f9; height: 8px; border-radius: 4px; flex-shrink: 0; }
    .ts-circle       { background: #f1f5f9; width: 20px; height: 20px; border-radius: 10px; flex-shrink: 0; }
    .ts-pagination   { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
    .ts-pagination__info { background: #f1f5f9; height: 16px; width: 120px; border-radius: 4px; }
    .ts-pagination__btns { display: flex; gap: 4px; align-items: center; }
    .ts-page-btn     { width: 28px; height: 28px; background: #f1f5f9; border-radius: 4px; flex-shrink: 0; }

    /* ═══════════════════════════════════════════════
       AI PANEL  (ts-ai-* prefix)
    ═══════════════════════════════════════════════ */
    .ts-ai-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #ffffff;
      transition: width 0.25s ease, height 0.25s ease;
    }

    /* ── closed ── */
    .ts-ai--closed .ts-ai-panel { display: none; }

    /* ── left-docked (panel left, CRM right) ── */
    .ts-ai--left .ts-ai-panel { width: 400px; flex-shrink: 0; border-right: 1px solid #d4d5d6; }
    .ts-ai--left .ts-crm      { order: 2; }
    .ts-ai--left .ts-ai-panel { order: 1; }

    /* ── right-docked (CRM left, panel right) ── */
    .ts-ai--right .ts-ai-panel { width: 400px; flex-shrink: 0; border-left: 1px solid #d4d5d6; }
    .ts-ai--right .ts-crm     { order: 1; }
    .ts-ai--right .ts-ai-panel{ order: 2; }

    /* ── fullscreen ── */
    .ts-ai--fullscreen .ts-crm      { display: none; }
    .ts-ai--fullscreen .ts-ai-panel { flex: 1; min-width: 0; }
    .ts-ai--fullscreen .ts-ai-panel .t1-ab { border-radius: 0 !important; }

    /* ── Panel open animation — slides up from bottom ── */
    @keyframes ts-panel-open {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* ── popover (floating above content) ── */
    .ts-ai--popover .ts-crm { flex: 1; }
    .ts-ai--popover .ts-ai-panel {
      position: absolute;
      left: 24px;
      top: 26.9%;
      bottom: 0;
      width: 400px;
      z-index: 10;
      border: 1px solid #d4d5d6;
      box-shadow: 0 8px 24px rgba(25,40,57,0.12);
      border-radius: 8px 8px 0 0;
      animation: ts-panel-open 0.38s cubic-bezier(0.32, 0.72, 0, 1) both;
    }

    /* ── minimized (44px strip at bottom) ── */
    .ts-ai--minimized .ts-crm { flex: 1; }
    .ts-ai--minimized .ts-ai-panel {
      position: absolute;
      left: 24px;
      bottom: 0;
      width: 400px;
      height: 44px;
      z-index: 10;
      border: 1px solid #d4d5d6;
      box-shadow: 0 -8px 24px rgba(25,40,57,0.12);
      border-radius: 8px 8px 0 0;
    }
    .ts-ai--minimized .ts-ai-panel__body { display: none; }

    /* AppBar corner overrides per state */
    .ts-ai--left  .ts-ai-panel .t1-ab,
    .ts-ai--right .ts-ai-panel .t1-ab { border-radius: 0 !important; }
    .ts-ai--popover   .ts-ai-panel .t1-ab,
    .ts-ai--minimized .ts-ai-panel .t1-ab { border-radius: 8px 8px 0 0 !important; }

    /* ── Panel body ── */
    .ts-ai-panel__body {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
      position: relative; /* contains drawer so it never overlaps AppBar */
    }

    /* ── Fullscreen sidebar (SideNavigation) ── */
    .ts-ai-sidebar {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid #e2e8f0;
    }
    .ts-ai-sidebar .t1-sn { flex: 1; min-height: 0; border-right: none; width: 100%; }
    .ts-ai--fullscreen .ts-ai-panel__body .t1-sn { width: 280px; flex-shrink: 0; min-height: 0; }

    .ts-ai-settings { flex-shrink: 0; padding: 8px 16px 12px; border-top: 1px solid #e8e9eb; width: 280px; }
    .ts-ai-settings .t1-btn { width: 100%; justify-content: flex-start; }

    /* ── Sidenav drawer keyframes ── */
    @keyframes ts-sidenav-backdrop-in  { from { background: rgba(25,40,57,0);    } to { background: rgba(25,40,57,0.35); } }
    @keyframes ts-sidenav-backdrop-out { from { background: rgba(25,40,57,0.35); } to { background: rgba(25,40,57,0);    } }
    @keyframes ts-sidenav-panel-in  { from { transform: translateX(-100%); } to { transform: translateX(0);    } }
    @keyframes ts-sidenav-panel-out { from { transform: translateX(0);    } to { transform: translateX(-100%); } }

    /* ── Sidenav drawer (hamburger toggle in non-fullscreen states) ── */
    .ts-ai-sidenav-drawer {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      animation: ts-sidenav-backdrop-in 0.3s ease both;
    }
    .ts-ai-sidenav-drawer.is-closing {
      animation: ts-sidenav-backdrop-out 0.22s ease both;
      pointer-events: none;
    }
    .ts-ai-sidenav-drawer__panel {
      width: 280px;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 2px 0 12px rgba(25,40,57,0.1);
      animation: ts-sidenav-panel-in 0.32s cubic-bezier(0.32, 0.72, 0, 1) both;
    }
    .ts-ai-sidenav-drawer.is-closing .ts-ai-sidenav-drawer__panel {
      animation: ts-sidenav-panel-out 0.22s ease both;
    }
    .ts-ai-sidenav-drawer__panel .t1-sn { flex: 1; min-height: 0; border-right: none; width: 100%; }
    .ts-ai-sidenav-drawer__settings { flex-shrink: 0; padding: 8px 16px 12px; border-top: 1px solid #e8e9eb; }
    .ts-ai-sidenav-drawer__settings .t1-btn { width: 100%; justify-content: flex-start; }

    /* ── Chat content column ── */
    .ts-ai-panel__chat {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fff;
    }

    /* ── Thread ── */
    .ts-ai-thread {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 16px;
      display: flex;
      flex-direction: column;
    }
    .ts-ai-thread .t1-chat__row--assistant { flex-direction: column; }
    .ts-ai-thread .t1-chat__row--assistant > .t1-response { flex: initial; width: 100%; }

    /* ── Welcome state ── */
    .ts-ai-welcome {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      padding: 24px 0 0;
      gap: 16px;
    }
    .ts-ai-welcome .t1-wlc,
    .ts-ai-welcome .t1-sug { width: 100%; }

    /* ── PromptInput wrapper ── */
    .ts-ai-input { flex-shrink: 0; padding: 16px; }

    /* Fullscreen: center at max 820px */
    .ts-ai--fullscreen .ts-ai-thread { padding: 0 0 16px; align-items: center; }
    .ts-ai--fullscreen .ts-ai-thread > * { width: 100%; max-width: 820px; }
    .ts-ai--fullscreen .ts-ai-input {
      padding: 16px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .ts-ai--fullscreen .ts-ai-input > .t1-pi { width: 100%; max-width: 820px; }
    .ts-ai--fullscreen .ts-ai-disclaimer { width: 100%; max-width: 820px; }

    /* ── Disclaimer ── */
    .ts-ai-disclaimer {
      font-size: 11px;
      font-weight: 400;
      color: #969aa3;
      text-align: center;
      padding-top: 6px;
    }

    /* ── ListingCard: narrow container overrides ── */
    .ts-ai--popover .t1-lc__item,
    .ts-ai--left    .t1-lc__item,
    .ts-ai--right   .t1-lc__item { padding: 12px; }
    .ts-ai--popover .t1-lc__body,
    .ts-ai--left    .t1-lc__body,
    .ts-ai--right   .t1-lc__body { flex-wrap: wrap; align-items: flex-start; }
    .ts-ai--popover .t1-lc__info,
    .ts-ai--left    .t1-lc__info,
    .ts-ai--right   .t1-lc__info { width: 100%; }
    .ts-ai--popover .t1-lc__suffix,
    .ts-ai--left    .t1-lc__suffix,
    .ts-ai--right   .t1-lc__suffix { flex-direction: row; align-items: center; justify-content: flex-start; gap: 8px; width: 100%; min-width: 0; }
    .ts-ai--popover .t1-lc__suffix-label,
    .ts-ai--popover .t1-lc__suffix-detail,
    .ts-ai--left    .t1-lc__suffix-label,
    .ts-ai--left    .t1-lc__suffix-detail,
    .ts-ai--right   .t1-lc__suffix-label,
    .ts-ai--right   .t1-lc__suffix-detail { text-align: left; white-space: normal; padding: 0; }
    .ts-ai--popover .t1-lc__suffix-label::after,
    .ts-ai--left    .t1-lc__suffix-label::after,
    .ts-ai--right   .t1-lc__suffix-label::after { content:'·'; margin-left:8px; color:#b4b6bb; }
    .ts-ai--popover .t1-lc__title, .ts-ai--popover .t1-lc__sub, .ts-ai--popover .t1-lc__desc,
    .ts-ai--left    .t1-lc__title, .ts-ai--left    .t1-lc__sub, .ts-ai--left    .t1-lc__desc,
    .ts-ai--right   .t1-lc__title, .ts-ai--right   .t1-lc__sub, .ts-ai--right   .t1-lc__desc { white-space: normal; word-break: break-word; }
    .ts-ai--popover .t1-lc__nameid,
    .ts-ai--left    .t1-lc__nameid,
    .ts-ai--right   .t1-lc__nameid { flex-wrap: wrap; }

    /* ── Streaming cursor ── */
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
    .ts-ai-cursor { display:inline-block; width:2px; height:13px; background:#4285f4; margin-left:1px; vertical-align:middle; border-radius:1px; animation:blink 0.9s ease-in-out infinite; }

    /* ── Message row fade-in — user bubbles only ── */
    /* Assistant rows must NOT animate-in: the ReasoningLog was already visible
       during the turn, and replaying opacity-0 would cause a flash on commit. */
    @keyframes t1-msg-in { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    .t1-chat__row--user { animation: t1-msg-in 0.18s ease; }

    /* ── Lazy-load: response sections reveal after streaming completes ── */
    /* Fires once when each element enters the DOM (committed message).    */
    @keyframes t1-lazy-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0);   }
    }
    /* Ordered / unordered list items — stagger 80 ms per item */
    .t1-chat__row--assistant .t1-response__list li {
      animation: t1-lazy-in 0.28s ease both;
    }
    .t1-chat__row--assistant .t1-response__list li:nth-child(1) { animation-delay:  80ms; }
    .t1-chat__row--assistant .t1-response__list li:nth-child(2) { animation-delay: 160ms; }
    .t1-chat__row--assistant .t1-response__list li:nth-child(3) { animation-delay: 240ms; }
    .t1-chat__row--assistant .t1-response__list li:nth-child(4) { animation-delay: 320ms; }
    .t1-chat__row--assistant .t1-response__list li:nth-child(5) { animation-delay: 400ms; }
    .t1-chat__row--assistant .t1-response__list li:nth-child(6) { animation-delay: 480ms; }
    /* Content-slot card (listing card, deal card, etc.) */
    .t1-chat__row--assistant .t1-response__slot {
      animation: t1-lazy-in 0.35s ease 120ms both;
    }
    /* Feedback action bar — appears last once response is fully settled */
    .t1-chat__row--assistant .t1-fa {
      animation: t1-lazy-in 0.3s ease 520ms both;
    }

    /* ═══════════════════════════════════════════════
       ONBOARDING  (t1-onb-* prefix)
       First-run flow rendered inside the AI panel's chat column.
       Tokens only — no hardcoded colors/spacing.
    ═══════════════════════════════════════════════ */
    .t1-onb {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--t1-bg);
    }

    /* ── Persistent header (stepper / progress) — consistent height ── */
    .t1-onb__topbar {
      flex-shrink: 0;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--t1-space-6);
      border-bottom: 1px solid var(--t1-border-subtle);
      background: var(--t1-bg);
    }

    /* ── Stepper (Steps 2–4) ── */
    .t1-onb-stepper { display: flex; align-items: center; gap: var(--t1-space-1); width: 100%; max-width: 680px; }
    .t1-onb-stepper__step { display: flex; align-items: center; gap: var(--t1-space-2); flex-shrink: 0; }
    .t1-onb-stepper__node {
      width: 22px; height: 22px; border-radius: var(--t1-radius-pill);
      display: flex; align-items: center; justify-content: center;
      font-size: var(--t1-text-12); font-weight: var(--t1-weight-semibold);
      background: var(--t1-neutral-100); color: var(--t1-fg-muted);
      border: 1.5px solid var(--t1-border); flex-shrink: 0;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .t1-onb-stepper__label { font-size: var(--t1-text-14); line-height: var(--t1-leading-14); font-weight: var(--t1-weight-medium); color: var(--t1-fg-subtle); white-space: nowrap; }
    .t1-onb-stepper__line { flex: 1; height: 2px; min-width: 12px; background: var(--t1-border); border-radius: var(--t1-radius-pill); }
    .t1-onb-stepper__step--done  .t1-onb-stepper__node  { background: var(--t1-green-500); border-color: var(--t1-green-500); color: var(--t1-fg-on-primary); }
    .t1-onb-stepper__step--done  .t1-onb-stepper__label { color: var(--t1-fg-muted); }
    .t1-onb-stepper__step--done  + .t1-onb-stepper__line { background: var(--t1-green-500); }
    .t1-onb-stepper__step--active .t1-onb-stepper__node { background: var(--t1-bg-brand); border-color: var(--t1-bg-brand); color: var(--t1-fg-on-primary); }
    .t1-onb-stepper__step--active .t1-onb-stepper__label { color: var(--t1-fg); font-weight: var(--t1-weight-semibold); }

    /* Eyebrow pill — Step 1 "Setup · 1 of 4" */
    .t1-onb-eyebrow {
      display: inline-flex; align-items: center; gap: var(--t1-space-2);
      padding: var(--t1-space-1) var(--t1-space-3);
      border-radius: var(--t1-radius-pill);
      background: var(--t1-bg-brand-soft); color: var(--t1-blue-600);
      font-size: var(--t1-text-12); line-height: var(--t1-leading-12); font-weight: var(--t1-weight-semibold);
    }

    /* ── Scroll body ── */
    .t1-onb__scroll { flex: 1; min-height: 0; overflow-y: auto; padding: var(--t1-space-8) var(--t1-space-6); }
    .t1-onb__inner  { width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--t1-space-5); animation: t1-lazy-in .3s ease both; }
    .t1-onb__inner--wide { max-width: 680px; }

    .t1-onb__lead { display: flex; flex-direction: column; gap: var(--t1-space-2); }
    .t1-onb__title { font-size: var(--t1-text-24); line-height: var(--t1-leading-24); font-weight: var(--t1-weight-semibold); color: var(--t1-fg); letter-spacing: -0.01em; }
    .t1-onb__subtitle { font-size: var(--t1-text-14); line-height: 20px; color: var(--t1-fg-muted); }

    /* ── Footer ── */
    .t1-onb__footer {
      flex-shrink: 0;
      border-top: 1px solid var(--t1-border-subtle);
      padding: var(--t1-space-4) var(--t1-space-6);
      display: flex; flex-direction: column; align-items: center; gap: var(--t1-space-3);
      background: var(--t1-bg);
    }
    .t1-onb__footer-row { width: 100%; max-width: 560px; display: flex; align-items: center; justify-content: space-between; gap: var(--t1-space-4); }
    .t1-onb__footer-row--wide { max-width: 680px; }
    .t1-onb__foot-note { font-size: var(--t1-text-12); line-height: var(--t1-leading-12); color: var(--t1-fg-subtle); text-align: center; }
    .t1-onb__skip {
      background: none; border: none; cursor: pointer; padding: var(--t1-space-2);
      font-family: var(--t1-font-sans); font-size: var(--t1-text-14); line-height: var(--t1-leading-14);
      font-weight: var(--t1-weight-medium); color: var(--t1-fg-muted);
      display: inline-flex; align-items: center; gap: var(--t1-space-1);
      transition: color .15s ease;
    }
    .t1-onb__skip:hover { color: var(--t1-fg); }
    .t1-onb__skip-wrap { position: relative; }

    /* Skip confirmation tooltip */
    .t1-onb-tip {
      position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
      width: 236px; background: var(--t1-neutral-900); color: var(--t1-neutral-0);
      border-radius: var(--t1-radius-md); padding: var(--t1-space-3);
      box-shadow: var(--t1-shadow-pop); z-index: 40;
      display: flex; flex-direction: column; gap: var(--t1-space-3);
      animation: t1-lazy-in .18s ease both;
    }
    .t1-onb-tip__text { font-size: var(--t1-text-12); line-height: var(--t1-leading-14); }
    .t1-onb-tip__row { display: flex; align-items: center; justify-content: flex-end; gap: var(--t1-space-3); }
    .t1-onb-tip__btn { background: none; border: none; cursor: pointer; font-family: var(--t1-font-sans); font-size: var(--t1-text-12); font-weight: var(--t1-weight-semibold); }
    .t1-onb-tip__btn--ghost { color: var(--t1-neutral-200); }
    .t1-onb-tip__btn--go { color: var(--t1-neutral-0); }
    .t1-onb-tip::after {
      content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      border: 6px solid transparent; border-top-color: var(--t1-neutral-900);
    }

    /* ── Step 1 form ── */
    .t1-onb-form { display: flex; flex-direction: column; gap: var(--t1-space-5); }
    .t1-onb-field { display: flex; flex-direction: column; gap: var(--t1-space-1); }
    .t1-onb-field__hint { font-size: var(--t1-text-12); line-height: var(--t1-leading-12); color: var(--t1-fg-subtle); }
    .t1-onb-field__err { display: flex; align-items: center; gap: var(--t1-space-1); font-size: var(--t1-text-12); line-height: var(--t1-leading-12); color: var(--t1-red-600); }
    .t1-onb-prefill .t1-input__box { background: var(--t1-neutral-50); }

    /* Chat turns rendered inside onboarding (Step 2 response) */
    .t1-onb .t1-chat { display: flex; flex-direction: column; gap: var(--t1-space-4); width: 100%; }
    .t1-onb .t1-chat__row { display: flex; }
    .t1-onb .t1-chat__row--assistant { flex-direction: column; }
    .t1-onb .t1-chat__row--user { justify-content: flex-end; }
    .t1-onb .ts-ai-input { flex-shrink: 0; }

    /* ── Starter prompt cards (Step 2) ── */
    .t1-onb-starters { display: flex; flex-direction: column; gap: var(--t1-space-3); }
    .t1-onb-starter {
      display: flex; align-items: center; gap: var(--t1-space-3); text-align: left; width: 100%;
      padding: var(--t1-space-4); border-radius: var(--t1-radius-md);
      border: 1px solid var(--t1-border); background: var(--t1-bg); cursor: pointer;
      font-family: var(--t1-font-sans);
      transition: border-color .15s ease, background .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .t1-onb-starter:hover { border-color: var(--t1-border-focus); background: var(--t1-bg-brand-soft); box-shadow: var(--t1-shadow-soft); }
    .t1-onb-starter__icon {
      width: 36px; height: 36px; border-radius: var(--t1-radius-md); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--t1-bg-brand-soft); color: var(--t1-blue-500); font-size: 18px;
    }
    .t1-onb-starter:hover .t1-onb-starter__icon { background: var(--t1-bg); }
    .t1-onb-starter__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .t1-onb-starter__label { font-size: var(--t1-text-14); line-height: var(--t1-leading-14); font-weight: var(--t1-weight-semibold); color: var(--t1-fg); }
    .t1-onb-starter__meta { font-size: var(--t1-text-12); line-height: var(--t1-leading-12); color: var(--t1-fg-muted); }
    .t1-onb-starter__arrow { color: var(--t1-fg-subtle); flex-shrink: 0; font-size: 16px; }

    /* Skeleton loaders */
    .t1-onb-skel {
      display: flex; align-items: center; gap: var(--t1-space-3);
      padding: var(--t1-space-4); border-radius: var(--t1-radius-md);
      border: 1px solid var(--t1-border); background: var(--t1-bg);
    }
    .t1-onb-skel__sq { width: 36px; height: 36px; border-radius: var(--t1-radius-md); flex-shrink: 0; }
    .t1-onb-skel__lines { flex: 1; display: flex; flex-direction: column; gap: var(--t1-space-2); }
    .t1-onb-shimmer {
      background: linear-gradient(90deg, var(--t1-neutral-100) 25%, var(--t1-neutral-50) 37%, var(--t1-neutral-100) 63%);
      background-size: 400% 100%; animation: t1-onb-shimmer 1.4s ease infinite; border-radius: var(--t1-radius-xs);
    }
    @keyframes t1-onb-shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

    /* ── Nudge banner (Step 2) ── */
    .t1-onb-nudge {
      display: flex; align-items: center; gap: var(--t1-space-3);
      padding: var(--t1-space-3) var(--t1-space-4); border-radius: var(--t1-radius-md);
      background: var(--t1-bg-brand-soft); border: 1px solid var(--t1-blue-100);
      animation: t1-onb-slideup .4s cubic-bezier(0.32,0.72,0,1) both;
    }
    @keyframes t1-onb-slideup { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .t1-onb-nudge__dot { width: 32px; height: 32px; border-radius: var(--t1-radius-md); flex-shrink: 0; background: var(--t1-gradient-brand-diag); display: flex; align-items: center; justify-content: center; color: var(--t1-neutral-0); font-size: 16px; }
    .t1-onb-nudge__text { flex: 1; min-width: 0; font-size: var(--t1-text-14); line-height: 20px; color: var(--t1-fg); font-weight: var(--t1-weight-medium); }

    /* Resume banner */
    .t1-onb-resume { animation: t1-onb-slideup .4s cubic-bezier(0.32,0.72,0,1) both; }

    /* ── Routine cards (Step 3) ── */
    .t1-onb-routines { display: flex; flex-direction: column; gap: var(--t1-space-3); }
    .t1-onb-routine {
      border: 1px solid var(--t1-border); border-radius: var(--t1-radius-md);
      padding: var(--t1-space-4); background: var(--t1-bg);
      display: flex; flex-direction: column; gap: var(--t1-space-3);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .t1-onb-routine--added { border-color: var(--t1-green-100); background: var(--t1-green-25); }
    .t1-onb-routine__head { display: flex; align-items: flex-start; gap: var(--t1-space-3); }
    .t1-onb-routine__icon { width: 36px; height: 36px; border-radius: var(--t1-radius-md); flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--t1-bg-brand-soft); color: var(--t1-blue-500); font-size: 18px; }
    .t1-onb-routine__title { font-size: var(--t1-text-14); line-height: var(--t1-leading-14); font-weight: var(--t1-weight-semibold); color: var(--t1-fg); }
    .t1-onb-routine__desc { font-size: var(--t1-text-12); line-height: 18px; color: var(--t1-fg-muted); margin-top: 4px; }
    .t1-onb-routine__foot { display: flex; align-items: center; justify-content: space-between; gap: var(--t1-space-3); flex-wrap: wrap; }

    /* Segmented cadence control */
    .t1-onb-seg { display: inline-flex; padding: 2px; border-radius: var(--t1-radius-md); background: var(--t1-neutral-100); gap: 2px; }
    .t1-onb-seg__btn {
      background: none; border: none; cursor: pointer; font-family: var(--t1-font-sans);
      font-size: var(--t1-text-12); line-height: var(--t1-leading-12); font-weight: var(--t1-weight-medium);
      color: var(--t1-fg-muted); padding: var(--t1-space-1) var(--t1-space-3); border-radius: var(--t1-radius-sm);
      transition: background .15s ease, color .15s ease;
    }
    .t1-onb-seg__btn--active { background: var(--t1-bg); color: var(--t1-fg); box-shadow: var(--t1-shadow-soft); font-weight: var(--t1-weight-semibold); }
    .t1-onb-added-pill { display: inline-flex; align-items: center; gap: var(--t1-space-1); font-size: var(--t1-text-12); font-weight: var(--t1-weight-semibold); color: var(--t1-green-700); }

    /* ── Prompt library rows (Step 4) ── */
    .t1-onb-plib { display: flex; flex-direction: column; border: 1px solid var(--t1-border); border-radius: var(--t1-radius-md); overflow: hidden; }
    .t1-onb-plib__row {
      display: flex; align-items: center; gap: var(--t1-space-3); width: 100%; text-align: left;
      padding: var(--t1-space-3) var(--t1-space-4); background: var(--t1-bg); border: none; cursor: pointer;
      border-bottom: 1px solid var(--t1-border-subtle); font-family: var(--t1-font-sans);
      transition: background .12s ease;
    }
    .t1-onb-plib__row:last-child { border-bottom: none; }
    .t1-onb-plib__row:hover { background: var(--t1-bg-brand-soft); }
    .t1-onb-plib__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .t1-onb-plib__top { display: flex; align-items: center; gap: var(--t1-space-2); }
    .t1-onb-plib__cmd { font-family: var(--t1-font-mono); font-size: var(--t1-text-12); font-weight: var(--t1-weight-semibold); color: var(--t1-blue-600); }
    .t1-onb-plib__desc { font-size: var(--t1-text-12); line-height: var(--t1-leading-14); color: var(--t1-fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t1-onb-plib__run { color: var(--t1-fg-subtle); flex-shrink: 0; font-size: 16px; }
    .t1-onb-plib__row:hover .t1-onb-plib__run { color: var(--t1-blue-500); }

    /* Category tags — token-based, no violet (brand-mark only) */
    .t1-onb-tag { display: inline-flex; align-items: center; padding: 1px var(--t1-space-2); border-radius: var(--t1-radius-pill); font-size: var(--t1-text-10); line-height: var(--t1-leading-12); font-weight: var(--t1-weight-semibold); text-transform: uppercase; letter-spacing: 0.04em; flex-shrink: 0; }
    .t1-onb-tag--sales { background: var(--t1-blue-50);  color: var(--t1-blue-600); }
    .t1-onb-tag--crm   { background: var(--t1-green-50); color: var(--t1-green-700); }
    .t1-onb-tag--fni   { background: var(--t1-amber-50); color: var(--t1-amber-700); }
    .t1-onb-tag--inv   { background: var(--t1-neutral-100); color: var(--t1-neutral-600); }

    /* ── Completion modal summary ── */
    .t1-onb-sum { display: flex; flex-direction: column; gap: var(--t1-space-4); }
    .t1-onb-sum__hero { display: flex; flex-direction: column; align-items: center; gap: var(--t1-space-3); text-align: center; }
    .t1-onb-sum__badge {
      width: 56px; height: 56px; border-radius: var(--t1-radius-pill);
      background: var(--t1-bg-success-soft); color: var(--t1-green-500);
      display: flex; align-items: center; justify-content: center; font-size: 30px;
    }
    .t1-onb-sum__title { font-size: var(--t1-text-24); line-height: var(--t1-leading-24); font-weight: var(--t1-weight-semibold); color: var(--t1-fg); }
    .t1-onb-sum__sub { font-size: var(--t1-text-14); line-height: 20px; color: var(--t1-fg-muted); }
    .t1-onb-sum__rows { display: flex; flex-direction: column; gap: var(--t1-space-1); border: 1px solid var(--t1-border-subtle); border-radius: var(--t1-radius-md); padding: var(--t1-space-2); }
    .t1-onb-sum__row { display: flex; align-items: center; gap: var(--t1-space-3); padding: var(--t1-space-2) var(--t1-space-3); border-radius: var(--t1-radius-sm); }
    .t1-onb-sum__ico { width: 32px; height: 32px; border-radius: var(--t1-radius-md); flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--t1-bg-brand-soft); color: var(--t1-blue-500); font-size: 16px; }
    .t1-onb-sum__label { flex: 1; min-width: 0; font-size: var(--t1-text-12); line-height: var(--t1-leading-12); color: var(--t1-fg-muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: var(--t1-weight-semibold); }
    .t1-onb-sum__val { font-size: var(--t1-text-14); line-height: var(--t1-leading-14); font-weight: var(--t1-weight-semibold); color: var(--t1-fg); }

    /* ═══════════════════════════════════════════════
       SCREEN INDEX  (dev nav — prototype browsing aid)
    ═══════════════════════════════════════════════ */
    .t1-nav-fab {
      position: fixed; right: 20px; bottom: 20px; z-index: 9999;
      display: inline-flex; align-items: center; gap: var(--t1-space-2);
      height: 40px; padding: 0 var(--t1-space-4); border: none; cursor: pointer;
      border-radius: var(--t1-radius-pill); background: var(--t1-neutral-900); color: var(--t1-neutral-0);
      font-family: var(--t1-font-sans); font-size: var(--t1-text-14); font-weight: var(--t1-weight-semibold);
      box-shadow: var(--t1-shadow-pop);
    }
    .t1-nav-panel {
      position: fixed; right: 20px; bottom: 72px; z-index: 9999;
      width: 300px; max-height: 72vh; overflow-y: auto;
      background: var(--t1-bg); border: 1px solid var(--t1-border);
      border-radius: var(--t1-radius-lg); box-shadow: var(--t1-shadow-pop);
      padding: var(--t1-space-3); animation: t1-lazy-in .18s ease both;
    }
    .t1-nav-panel__title { font-size: var(--t1-text-14); font-weight: var(--t1-weight-semibold); color: var(--t1-fg); padding: var(--t1-space-2) var(--t1-space-2) var(--t1-space-1); }
    .t1-nav-panel__group { font-size: var(--t1-text-10); font-weight: var(--t1-weight-semibold); text-transform: uppercase; letter-spacing: 0.06em; color: var(--t1-fg-subtle); padding: var(--t1-space-3) var(--t1-space-2) var(--t1-space-1); }
    .t1-nav-panel__link {
      display: flex; align-items: center; justify-content: space-between; gap: var(--t1-space-2);
      width: 100%; text-align: left; border: none; background: none; cursor: pointer;
      font-family: var(--t1-font-sans); font-size: var(--t1-text-14); line-height: var(--t1-leading-14); color: var(--t1-fg-muted);
      padding: var(--t1-space-2); border-radius: var(--t1-radius-sm); transition: background .12s ease, color .12s ease;
    }
    .t1-nav-panel__link:hover { background: var(--t1-neutral-50); color: var(--t1-fg); }
    .t1-nav-panel__link--active { background: var(--t1-bg-brand-soft); color: var(--t1-blue-600); font-weight: var(--t1-weight-semibold); }
    .t1-nav-panel__code { font-family: var(--t1-font-mono); font-size: var(--t1-text-10); color: var(--t1-fg-subtle); }

    /* Stepper condenses on narrow panels (Task 7) */
    @media (max-width: 560px) {
      .t1-onb-stepper__step:not(.t1-onb-stepper__step--active) .t1-onb-stepper__label { display: none; }
    }
  </style>

  <script type="text/babel">

    const streamRef      = { current: null };

    /* Soft-scroll el to its bottom. */
    function softScrollToBottom(el) {
      el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
    }

    /* True when the user hasn't scrolled more than 120 px above the bottom.
       Guards the auto-scroll so users can freely read older messages. */
    function isNearBottom(el) {

    }

    function streamText(full, bodyRef, threadEl, onDone) {
      let i = 0;
      /* Initial kick — content is about to grow */
      if (threadEl) softScrollToBottom(threadEl);
      /* Keep following the bottom every 200 ms; throttled to avoid
         conflicting smooth-scroll animations in the browser. */
      scrollTimerRef.current = threadEl
        ? setInterval(() => {
            if (isNearBottom(threadEl)) softScrollToBottom(threadEl);
          }, 200)
        : null;

      function tick() {
        if (i < full.length) {
          i = Math.min(i + 1, full.length);
          if (bodyRef.current) bodyRef.current.textContent = full.slice(0, i);
          streamRef.current = requestAnimationFrame(tick);
        } else {
          clearInterval(scrollTimerRef.current);
          scrollTimerRef.current = null;
          if (threadEl) softScrollToBottom(threadEl);
          onDone();
        }
      }
      streamRef.current = requestAnimationFrame(tick);
    }

            <i className={`ph-bold ph-${open ? 'x' : 'squares-four'}`} /> Screens
          </button>
        </>
      );
    }

    /* Main onboarding view — dispatches to the step matching `screen` */
    function OnboardingFlow({ screen, onb, setOnb, navigate }) {
      const step = stepOf(screen);

      /* ── Step 1 — Identity & role ── */
      function renderStep1() {
        const nameValid = !!(onb.name || '').trim();
        const roleValid = !!onb.role;
        const nameErr = onb.errors && !nameValid;
        const roleErr = onb.errors && !roleValid;
        const pristine = !onb.nameEdited && !nameErr;
        return (
          <>
            <div className="t1-onb__topbar">
              <span className="t1-onb-eyebrow"><i className="ph-fill ph-sparkle" style={{ fontSize: 12 }} /> Setup · 1 of 4</span>
            </div>
            <div className="t1-onb__scroll">
              <div className="t1-onb__inner">
                <div className="t1-onb__lead">
                  <div className="t1-onb__title">First, who are you?</div>
                  <div className="t1-onb__subtitle">T1 personalizes everything — prompts, routines, and shortcuts — around your name and role.</div>
                </div>
                <div className="t1-onb-form">
                  <div className="t1-onb-field">
                    <InputText
                      label="Your name"
                      value={onb.name}
                      className={pristine ? 't1-onb-prefill' : ''}
                      error={nameErr ? 'Enter a name to continue' : undefined}
                      assistive={pristine ? 'Prefilled from your account — edit if needed' : undefined}
                      onChange={(v) => setOnb(o => ({ ...o, name: v, nameEdited: true }))}
                    />
                  </div>
                  <div className="t1-onb-field">
                    <Dropdown
                      title="Your role"
                      placeholder="Select your role"
                      value={onb.role}
                      items={ROLE_OPTIONS}
                      onChange={(v) => setOnb(o => ({ ...o, role: v }))}
                    />
                    {roleErr && <div className="t1-onb-field__err"><i className="ph-fill ph-warning-circle" /> Select a role to continue</div>}
                  </div>
                </div>
              </div>
            </div>
            <div className="t1-onb__footer">
              <div className="t1-onb__footer-row">
                <span />
                <Button
                  size="lg" variant="contained" color="primary" iconEnd="arrow-right"
                  disabled={!(nameValid && roleValid)}
                  onClick={() => navigate('step2')}
                >Next</Button>
              </div>
              <div className="t1-onb__foot-note">Takes about 2 minutes · Change everything later in Settings</div>
            </div>
          </>
        );
      }

      /* ── Step 2 — Try T1 ── */
      function renderStep2() {
        const isResp    = screen === 'step2-response';
        const isLoading = screen === 'step2-loading';
        const isEmpty   = screen === 'step2-empty';
        const showTip   = screen === 'step2-skip';
        const r = matchResponse(onb.ranText || STARTER_PROMPTS[0].label);
        return (
          <>
            <div className="t1-onb__topbar"><OnbStepper active={2} /></div>
            <div className="t1-onb__scroll">
              <div className="t1-onb__inner">
                {isResp ? (
                  <div className="t1-chat">
                    <div className="t1-chat__row t1-chat__row--user"><ChatBubble>{onb.ranText || STARTER_PROMPTS[0].label}</ChatBubble></div>
                    <div className="t1-chat__row t1-chat__row--assistant">
                      <ReasoningLog inProgress={false} interrupted={false} steps={r.steps} />
                      <Response
                        title={r.title}
                        orderedList={r.orderedList}
                        unorderedList={r.unorderedList}
                        contentSlot={renderSlot(r)}
                        showFilter={!!r.filterCount}
                        showSource={!!r.sourceCount}
                        filterCount={r.filterCount}
                        sourceCount={r.sourceCount}
                        filterItems={r.filterItems}
                        sourceItems={r.sourceItems}
                      >{r.body}</Response>
                    </div>
                    <div className="t1-onb-nudge">
                      <span className="t1-onb-nudge__dot"><i className="ph-fill ph-sparkle" style={{ fontSize: 16 }} /></span>
                      <span className="t1-onb-nudge__text">That's T1. Let's set up a few more to come back to.</span>

                      <div className="t1-onb__title">Try T1 in chat</div>
                      <div className="t1-onb__subtitle">Here are a few things to ask, tuned to your role. Tap one to run it — or type your own below.</div>

                      <div className="t1-onb-starters">{[0, 1, 2].map(i => <SkelCard key={i} />)}</div>

                                onClick={() => setOnb(o => ({ ...o, cadences: { ...o.cadences, [rt.id]: c }, routines: o.routines[rt.id] ? { ...o.routines, [rt.id]: c } : o.routines }))}

                          </div>
                          {added ? (
                            <span className="t1-onb-added-pill"><i className="ph-fill ph-check-circle" /> On homepage</span>

                            <Button size="md" variant="outlined" color="primary" iconStart="plus" onClick={() => setOnb(o => ({ ...o, routines: { ...o.routines, [rt.id]: cadence } }))}>Add to homepage</Button>

            <div className="t1-onb__footer">
              <div className="t1-onb__footer-row">
                <button className="t1-onb__skip" onClick={() => navigate('step4')}>Skip this step <i className="ph ph-arrow-right" /></button>

      /* ── Step 4 — Prompt library ── */

        return (
          <>

              <div className="t1-onb__inner t1-onb__inner--wide">

                  <div className="t1-onb__title">Your prompt library</div>
                  <div className="t1-onb__subtitle">A curated set of things you can ask T1, tuned to your role. Tap any to run it.</div>
                </div>

                  <div className="t1-onb-resume">
                    <NotificationBanner color="success" title={`Ran ${onb.ranLib}`} description="Results are ready in your chat thread." onClose={() => setOnb(o => ({ ...o, ranLib: null }))} />
                  </div>
                )}
                <div className="t1-onb-plib">
                  {PROMPT_LIBRARY.map((p, i) => (
                    <button key={i} className="t1-onb-plib__row" onClick={() => setOnb(o => ({ ...o, ranLib: p.cmd }))}>
                      <div className="t1-onb-plib__body">
                        <div className="t1-onb-plib__top">
                          <span className="t1-onb-plib__cmd">{p.cmd}</span>
                          <span className={`t1-onb-tag t1-onb-tag--${p.tag}`}>{p.cat}</span>
                        </div>
                        <div className="t1-onb-plib__desc">{p.desc}</div>
                      </div>
                      <span className="t1-onb-plib__run"><i className="ph ph-play-circle" /></span>
                    </button>
                  ))}
                </div>
              </div>

            <div className="t1-onb__footer">
              <div className="t1-onb__footer-row t1-onb__footer-row--wide">
                <button className="t1-onb__skip" onClick={() => navigate('complete')}>Skip this step <i className="ph ph-arrow-right" /></button>
                <Button size="lg" variant="contained" color="primary" iconStart="check" onClick={() => navigate('complete')}>Done</Button>
              </div>
            </div>
          </>
        );
      }

      let content = null;
      if      (step === 1) content = renderStep1();
      else if (step === 2) content = renderStep2();
      else if (step === 3) content = renderStep3();
      else if (step === 4) content = renderStep4();
      return <div className="t1-onb">{content}</div>;
    }

    /* ═══════════════════════════════════════════════════════════════════
       CHAT APP — root component
    ═══════════════════════════════════════════════════════════════════ */
    function ChatApp() {
      /* Panel state: 'closed'|'popover'|'left'|'right'|'fullscreen'|'minimized' */
      const [panelState,  setPanelState]  = useState(ONB_SCREENS.includes(ONB_INITIAL) ? 'fullscreen' : 'popover');
      const [panelLeft,   setPanelLeft]   = useState(null); /* px — X-only drag */
      const prevStateRef                  = useRef('popover');
      const dragRef                       = useRef(null);

      /* ── Onboarding routing (?screen=) ── */
      const [screen,  setScreen]  = useState(ONB_INITIAL);
      const [onb,     setOnb]     = useState(() => seedFor(ONB_INITIAL));
      const [navOpen, setNavOpen] = useState(false);
      const isOnboarding = ONB_SCREENS.includes(screen);

      function navigate(next, opts) {
        opts = opts || {};
        try {
          const url = new URL(window.location);
          url.searchParams.set('screen', next);
          window.history.pushState({}, '', url);
        } catch (e) { /* file:// — URL update is best-effort */ }
        if (opts.reseed) setOnb(seedFor(next));
        setScreen(next);
        setNavOpen(false);
      }

      /* Keep panel docking in sync with the active screen */
      useEffect(() => {
        setPanelState(ONB_SCREENS.includes(screen) ? 'fullscreen' : 'popover');
      }, [screen]);

      /* Back / forward navigation */
      useEffect(() => {
        function onPop() {
          const s = new URLSearchParams(window.location.search).get('screen') || 'home';
          setOnb(seedFor(s));
          setScreen(s);
        }
        window.addEventListener('popstate', onPop);
        return () => window.removeEventListener('popstate', onPop);
      }, []);

      /* Chat state */
      const [messages,    setMessages]    = useState([]);
      const [chatTitle,   setChatTitle]   = useState('Title');
      const [phase,       setPhase]       = useState('idle');
      const [pendingMeta, setPendingMeta] = useState(null);
      const [sideSearch,  setSideSearch]  = useState('');

      /* 4 randomly chosen suggestions — re-picked on every new chat */
      const [activeSuggestions, setActiveSuggestions] = useState(pickSuggestions);

      /* Nav variant — 'home' | 'tasks' — drives NavBar appearance */
      const [navVariant,  setNavVariant]  = useState('home');
      /* Sidenav drawer open in non-fullscreen panel states */
      const [sideNavOpen,    setSideNavOpen]    = useState(false);
      const [sideNavClosing, setSideNavClosing] = useState(false);

      function closeSideNav() {
        setSideNavClosing(true);
        setTimeout(() => {
          setSideNavOpen(false);
          setSideNavClosing(false);
        }, 220);
      }

      const threadRef       = useRef(null);
      const streamBodyRef   = useRef(null);
      const thinkTimer      = useRef(null);
      const thoughtTimer    = useRef(null);
      const msgIdRef        = useRef(0);
      /* Holds stream args until the streaming DOM has been committed by React */
      const pendingStreamRef = useRef(null);

      /* Auto-scroll on message/phase changes — soft so the eye follows. */
      useEffect(() => {
        if (threadRef.current) softScrollToBottom(threadRef.current);
      }, [messages, phase]);

      /* Start streaming AFTER React has committed the streaming-phase DOM so
         streamBodyRef.current is guaranteed to be set before the first tick. */
      useEffect(() => {
        if (phase !== 'streaming' || !pendingStreamRef.current) return;
        const { body, onDone } = pendingStreamRef.current;
        pendingStreamRef.current = null;
        streamText(body, streamBodyRef, threadRef.current, onDone);
      }, [phase]); // eslint-disable-line react-hooks/exhaustive-deps

      /* Cleanup timers on unmount */
      useEffect(() => () => {
        clearTimeout(thinkTimer.current);
        clearTimeout(thoughtTimer.current);
        cancelAnimationFrame(streamRef.current);
        clearInterval(scrollTimerRef.current);
      }, []);

      /* ── State machine ── */
      function goToState(next) {
        if (panelState !== 'minimized' && panelState !== 'fullscreen' && panelState !== 'closed') {
          prevStateRef.current = panelState;
        }
        setPanelLeft(null);
        setPanelState(next);
      }

      /* ── Drag — X-axis only; panel stays bottom-anchored ── */
      function handleAppBarDragStart(e) {
        if (panelState !== 'popover' && panelState !== 'minimized') return;
        e.preventDefault();
        const panel = e.currentTarget.closest('.ts-ai-panel');
        if (!panel) return;
        const rect = panel.getBoundingClientRect();
        dragRef.current = { offsetX: e.clientX - rect.left };
        const onMove = (ev) => {
          const maxLeft = window.innerWidth - rect.width;
          const x = Math.min(Math.max(0, ev.clientX - dragRef.current.offsetX), maxLeft);
          setPanelLeft(x);
        };
        const onUp = () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup',   onUp);
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup',   onUp);
      }

      /* ── Chat handlers ── */
      function handleSend(text) {
        if (!text || !text.trim() || phase !== 'idle') return;
        if (panelState === 'closed') setPanelState('popover');
        const response = matchResponse(text);
        const uid = ++msgIdRef.current;
        if (messages.length === 0) setChatTitle(text.trim().slice(0, 40));
        setMessages(prev => [...prev, { id:uid, role:'user', content:text.trim() }]);
        setPendingMeta(response);
        setPhase('thinking');
        /* Wait for typewriter to finish all steps (65 ms/char) + 400 ms buffer */
        const totalTypingMs = response.steps.reduce((acc, s) => acc + s.length * 65, 0);
        thinkTimer.current = setTimeout(() => {
          setPhase('thought');
          thoughtTimer.current = setTimeout(() => {
            pendingStreamRef.current = {
              body: response.body,
              onDone: () => {
                const aid = ++msgIdRef.current;
                setMessages(prev => [...prev, { id:aid, role:'assistant', userText: text.trim(), ...response }]);
                setPhase('idle');
                setPendingMeta(null);
              },
            };
            setPhase('streaming');
          }, 400);
        }, Math.max(3000, totalTypingMs + 400));
      }

      /* Edit an existing user message in-place and regenerate the AI response.
         - Updates the user bubble text to newText
         - Drops all messages that came after it (the old AI response)
         - Streams a fresh AI response without appending another user message */
      function handleEditAndResend(msgId, newText) {
        const trimmed = newText.trim();
        if (!trimmed || phase !== 'idle') return;

        const response = matchResponse(trimmed);
        const msgIdx = messages.findIndex(m => m.id === msgId);

        /* Replace the edited message, discard everything after it */
        setMessages(prev => [
          ...prev.slice(0, msgIdx),
          { ...prev[msgIdx], content: trimmed },
        ]);

        setPendingMeta(response);
        setPhase('thinking');

        clearTimeout(thinkTimer.current);
        clearTimeout(thoughtTimer.current);
        cancelAnimationFrame(streamRef.current);
        clearInterval(scrollTimerRef.current);

        /* Wait for typewriter to finish all steps (65 ms/char) + 400 ms buffer */
        const totalTypingMs = response.steps.reduce((acc, s) => acc + s.length * 65, 0);
        thinkTimer.current = setTimeout(() => {
          setPhase('thought');
          thoughtTimer.current = setTimeout(() => {
            pendingStreamRef.current = {
              body: response.body,
              onDone: () => {
                const aid = ++msgIdRef.current;
                setMessages(prev => [...prev, { id: aid, role: 'assistant', userText: trimmed, ...response }]);
                setPhase('idle');
                setPendingMeta(null);
              },
            };
            setPhase('streaming');
          }, 400);
        }, Math.max(3000, totalTypingMs + 400));
      }

      function handleNewChat() {
        clearTimeout(thinkTimer.current);
        clearTimeout(thoughtTimer.current);
        cancelAnimationFrame(streamRef.current);
        clearInterval(scrollTimerRef.current);
        setMessages([]);
        setChatTitle('Title');
        setPhase('idle');
        setPendingMeta(null);
        setNavVariant('home');
        setSideNavOpen(false);
        setSideNavClosing(false);
        setActiveSuggestions(pickSuggestions());
        if (panelState === 'closed') setPanelState('popover');
      }

      function handleNewTask() {
        clearTimeout(thinkTimer.current);
        clearTimeout(thoughtTimer.current);
        cancelAnimationFrame(streamRef.current);
        clearInterval(scrollTimerRef.current);
        setMessages([]);
        setChatTitle('New Task');
        setPhase('idle');
        setPendingMeta(null);
        setNavVariant('tasks');
        setSideNavOpen(false);
        setSideNavClosing(false);
        if (panelState === 'closed') setPanelState('popover');
      }

      function handleChatSelect(item) {
        handleNewChat();
        setChatTitle(item.label);
      }

      /* ── AppBar type + orientation (Figma 1:1 mapping) ──
         popover  → stickyMaximized (drag grip + menu: L / R / Full)
         left     → panel orientation=right  (menu: R / Full / Pop Out)
         right    → panel orientation=left   (menu: L / Full / Pop Out)
         fullscreen → fullscreen             (menu: L / R / Pop Out)
         minimized → stickyMinimized         (caret-up + close, no menu)
      */
      const appBarType =
        panelState === 'fullscreen' ? 'fullscreen'      :
        panelState === 'minimized'  ? 'stickyMinimized' :
        panelState === 'popover'    ? 'stickyMaximized' :
                                      'panel';
      const appBarOrientation = panelState === 'left' ? 'right' : 'left';

      const showWelcome = messages.length === 0 && phase === 'idle';

      /* ── Render ── */
      return (
        <div className="ts-shell">

          {/* ══════════════════ MENUBAR ══════════════════ */}
          <div className="ts-menubar">
            <div className="ts-menubar__main">

              <div className="ts-menubar__nav">
                <button className="ts-icon-btn"><i className="ph ph-list" style={{fontSize:24}}/></button>
                <div className="ts-wordmark">
                  <svg width="178" height="32" viewBox="0 0 178 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fillRule="evenodd" clipRule="evenodd" d="M31.4745 6.20032C32.68 6.20032 33.657 7.19448 33.657 8.42115C33.657 9.64698 32.68 10.642 31.4745 10.642H19.0115V23.7878C19.0115 25.0145 18.0336 26.0087 16.8289 26.0087C15.6234 26.0087 14.6464 25.0145 14.6464 23.7878V10.642H2.18254C0.977845 10.642 0 9.64698 0 8.42115C0 7.19448 0.977845 6.20032 2.18254 6.20032H31.4745ZM175.904 6.22065C177.206 6.09482 178.301 7.13232 178.301 8.43065V21.774C178.301 23.054 177.763 24.3023 176.76 25.0757C175.536 26.0198 173.945 26.1598 172.601 25.4681C172.567 25.4506 172.533 25.4323 172.5 25.4123L149.09 11.7448C148.507 11.4056 147.782 11.8331 147.782 12.5165V23.7882C147.782 25.0865 146.687 26.1248 145.384 25.9982C144.25 25.8882 143.416 24.8523 143.416 23.6923V10.339C143.416 9.05732 143.956 7.80732 144.96 7.03398C146.184 6.09148 147.772 5.95315 149.116 6.64315C149.15 6.66148 149.184 6.67982 149.218 6.69982L172.626 20.3657C173.21 20.7065 173.936 20.2781 173.936 19.594V8.52648C173.936 7.36648 174.77 6.33065 175.904 6.22065ZM88.6503 6.54607C89.5553 5.73523 90.9336 5.82357 91.7313 6.74357C92.5289 7.66357 92.4413 9.0669 91.5372 9.87773C88.204 12.8677 84.8266 14.7794 81.7219 15.9927C84.8266 17.2061 88.204 19.1152 91.5372 22.1052C92.4413 22.9169 92.5289 24.3194 91.7313 25.2394C91.3005 25.7369 90.6977 25.9919 90.0933 25.9919C89.5807 25.9919 89.0655 25.8086 88.6503 25.4369C80.2297 17.8827 71.5266 18.3077 69.6438 18.5044V23.7077C69.6438 24.9352 68.6667 25.9286 67.4612 25.9286C66.2565 25.9286 65.2795 24.9352 65.2795 23.7077V8.42107C65.2795 7.1944 66.2565 6.20023 67.4612 6.20023C68.6667 6.20023 69.6438 7.1944 69.6438 8.42107V13.4769C70.4717 13.5602 72.6109 13.6869 75.4339 13.1769C80.2723 12.3044 84.7185 10.0736 88.6503 6.54607ZM59.4873 6.19998C60.6928 6.19998 61.6698 7.19415 61.6698 8.42082C61.6698 9.6003 60.7665 10.5648 59.6253 10.6373L59.4873 10.6416H45.4134C42.47 10.6416 40.0835 13.07 40.0835 16.065C40.0835 18.9949 42.3674 21.3817 45.2222 21.4841L45.4134 21.4875H59.4873C60.6928 21.4                   </svg>
                </div>
              </div>

              <div className="ts-menubar__search">
                <div className="ts-search-field">
                  <i className="ph ph-magnifying-glass" style={{fontSize:16,color:'#969aa3',flexShrink:0}}/>
                  <span className="ts-search-field__placeholder">Search</span>
                </div>
              </div>

              <div className="ts-menubar__actions">
                <div className="ts-split-btn">
                  <div className="ts-split-btn__text">
                    <div className="ts-split-btn__text-inner">
                      <i className="ph ph-plus" style={{fontSize:16,color:'#fff',flexShrink:0}}/>
                      <span className="ts-split-btn__label">Get Help</span>
                    </div>
                  </div>
                  <div className="ts-split-btn__caret">
                    <i className="ph ph-caret-down" style={{fontSize:24,color:'#fff'}}/>
                  </div>
                </div>
                <button className="ts-icon-btn"><i className="ph ph-user-circle"  style={{fontSize:24}}/></button>
                <button className="ts-icon-btn"><i className="ph ph-bell"          style={{fontSize:24}}/></button>
                <button className="ts-icon-btn"><i className="ph ph-chat-circle"   style={{fontSize:24}}/></button>
                <button className="ts-icon-btn"><i className="ph ph-envelope"      style={{fontSize:24}}/></button>
              </div>

            </div>

            <div className="ts-workspace">
              <WorkspaceAvatar/>
              <div className="ts-workspace__info">
                <p className="ts-workspace__name">Tachyon Motors</p>
                <p className="ts-workspace__site">Main site</p>
              </div>
              <div className="ts-workspace__chevron">
                <i className="ph ph-caret-down" style={{fontSize:16}}/>
              </div>
            </div>
          </div>

          {/* ══════════════════ BODY ══════════════════ */}
          <div className="ts-body">

            {/* ── Favbar ── */}
            <div className="ts-favbar">
              <div className="ts-favbar__scroll">

                {/* T1 AI tile — click to open/close panel */}
                <div
                  className="ts-ai-tile"
                  onClick={() => panelState === 'closed' ? setPanelState('popover') : setPanelState('closed')}
                  title="Toggle AI Assistant"
                >
                  <div className="ts-ai-tile__bg"/>
                  <div className="ts-ai-tile__inner"><T1Logo/></div>
                </div>

                <AppTile abbr="DS" indicator="ts-ind--red"/>
                <AppTile abbr="OM" indicator="ts-ind--teal"   icon="clock" label="OM"/>
                <AppTile abbr="A"  indicator="ts-ind--green"/>
                <AppTile abbr="CM" indicator="ts-ind--purple"/>
                <AppTile abbr="CA" indicator="ts-ind--purple"/>
                <AppTile abbr="SO" indicator="ts-ind--red"/>
                <AppTile abbr="PS" indicator="ts-ind--orange"/>
                <AppTile abbr="PO" indicator="ts-ind--orange"/>
              </div>

              <div className="ts-favbar__bottom">
                <div className="ts-favbar__bottom-section">
                  <AppTile abbr="" indicator="ts-ind--red" icon="clock" label="00.00 Hrs"/>
                  <div className="ts-favbar__avatar">
                    <span className="ts-favbar__avatar-text">AP</span>
                  </div>
                </div>
                <div className="ts-favbar__time-row">
                  <span className="ts-favbar__time-text">12:50 PM</span>
                </div>
              </div>
            </div>

            {/* ── Main content ── */}
            <div className="ts-main">
              <div className={`ts-main__inner ts-ai--${panelState}`}>

                {/* CRM skeleton */}
                <div className="ts-crm">
                  <div className="ts-page-nav"><div className="ts-page-nav__bar"/></div>
                  <div className="ts-action-bar">
                    <div className="ts-filter-group">
                      <div className="ts-filter-pill"/>
                      <div className="ts-filter-pill"/>
                      <div className="ts-filter-pill"/>
                    </div>
                    <div className="ts-search-box"/>
                  </div>
                  <div className="ts-table-wrap">
                    <div className="ts-table">
                      <HeaderRow/>
                      {ROWS.map((widths, i) => <DataRow key={i} widths={widths}/>)}
                    </div>
                  </div>
                  <div className="ts-pagination">
                    <div className="ts-pagination__info"/>
                    <div className="ts-pagination__btns">
                      {[1,2,3,4,5].map(i => <div key={i} className="ts-page-btn"/>)}
                    </div>
                  </div>
                </div>

                {/* ══════════════════ AI PANEL ══════════════════ */}
                {panelState !== 'closed' && (
                  <div
                    className="ts-ai-panel"
                    style={panelLeft !== null ? { left: panelLeft + 'px' } : undefined}
                  >

                    {/* AppBar — built-in Move & Resize menu + drag affordance */}
                    <AppBar
                      type={appBarType}
                      orientation={appBarOrientation}
                      title="AI Assistant"
                      onMinimize={() => { prevStateRef.current = panelState; goToState('minimized'); }}
                      onCollapse={() => goToState(prevStateRef.current || 'popover')}
                      onMove={(target) => goToState(target)}
                      onDragStart={handleAppBarDragStart}
                      onClose={()  => setPanelState('closed')}
                    />

                    {/* Panel body (hidden in minimized state via CSS) */}
                    <div className="ts-ai-panel__body">

                      {/* SideNavigation — fullscreen only (hidden during onboarding) */}
                      {panelState === 'fullscreen' && !isOnboarding && (() => {
                        const q = sideSearch.toLowerCase();
                        const filteredPinned = q
                          ? PINNED_CHATS.filter(c => c.label.toLowerCase().includes(q))
                          : PINNED_CHATS;
                        const filteredRecent = q
                          ? RECENT_CHATS.filter(c => c.label.toLowerCase().includes(q))
                          : RECENT_CHATS;
                        return (
                        <div className="ts-ai-sidebar">
                          <SideNavigation
                            scheduledTask={true}
                            sections="Expanded"
                            task="Default"
                            activeNav={navVariant === 'tasks' ? 'tasks' : 'home'}
                            searchValue={sideSearch}
                            onSearch={setSideSearch}
                            pinnedChats={filteredPinned}
                            recentTasks={RECENT_TASKS}
                            recentChats={filteredRecent}
                            onNewChat={handleNewChat}
                            onChatSelect={handleChatSelect}
                            onNavSelect={({ id }) => setNavVariant(id === 'tasks' ? 'tasks' : 'home')}
                            onViewAllPinned={() => console.log('view all pinned')}
                            onViewAllTasks={() => console.log('view all tasks')}
                          />
                          <div className="ts-ai-settings">
                            <Button variant="text" color="neutral" size="md" iconStart="gear">Settings</Button>
                          </div>
                        </div>
                        );
                      })()}

                      {/* Sidenav drawer — hamburger toggle for popover / docked states */}
                      {sideNavOpen && panelState !== 'fullscreen' && (
                        <div
                          className={`ts-ai-sidenav-drawer${sideNavClosing ? ' is-closing' : ''}`}
                          onClick={closeSideNav}
                        >
                          <div className="ts-ai-sidenav-drawer__panel" onClick={e => e.stopPropagation()}>
                            <SideNavigation
                              scheduledTask={true}
                              sections="Expanded"
                              task="Default"
                              activeNav={navVariant === 'tasks' ? 'tasks' : 'home'}
                              searchValue={sideSearch}
                              onSearch={setSideSearch}
                              pinnedChats={PINNED_CHATS}
                              recentTasks={RECENT_TASKS}
                              recentChats={RECENT_CHATS}
                              onNewChat={() => handleNewChat()}
                              onChatSelect={(c) => { handleChatSelect(c); closeSideNav(); }}
                              onNavSelect={({ id }) => {
                                setNavVariant(id === 'tasks' ? 'tasks' : 'home');
                                closeSideNav();
                              }}
                              onViewAllPinned={() => console.log('view all pinned')}
                              onViewAllTasks={() => console.log('view all tasks')}
                            />
                            <div className="ts-ai-sidenav-drawer__settings">
                              <Button variant="text" color="neutral" size="md" iconStart="gear">Settings</Button>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* Chat column */}
                      <div className="ts-ai-panel__chat">

                        {isOnboarding ? (
                          <OnboardingFlow screen={screen} onb={onb} setOnb={setOnb} navigate={navigate} />
                        ) : (
                         <React.Fragment>
                        {/* NavBar — hamburger only in narrow panel states (not fullscreen) */}
                        {navVariant === 'tasks' ? (
                          <NavBar
                            title="Tasks"
                            onMenuClick={panelState !== 'fullscreen' ? () => sideNavOpen ? closeSideNav() : setSideNavOpen(true) : undefined}
                            actionLabel="New task"
                            actionIcon="plus"
                            onAction={handleNewTask}
                          />
                        ) : (
                          <NavBar
                            title={chatTitle}
                            onMenuClick={panelState !== 'fullscreen' ? () => sideNavOpen ? closeSideNav() : setSideNavOpen(true) : undefined}
                            showNewChat
                            onNewChat={handleNewChat}
                            showMore
                            onMore={() => console.log('more')}
                          />
                        )}

                        {/* Thread */}
                        <div className="ts-ai-thread" ref={threadRef}>
                          {showWelcome ? (
                            <div className="ts-ai-welcome">
                              <Welcome
                                name="Sarah"
                                description="Your AI-powered sales assistant. Ask me about deals, leads, pipeline, or drafts."
                              />
                              <SuggestionList
                                items={navVariant === 'tasks' ? TASK_SUGGESTIONS : activeSuggestions}
                                onSelect={item => handleSend(item.label)}
                              />
                            </div>
                          ) : (
                            <div className="t1-chat">
                              {messages.map(msg =>
                                msg.role === 'user' ? (
                                  <div key={msg.id} className="t1-chat__row t1-chat__row--user">
                                    <ChatBubble
                                      onEdit={(newText) => handleEditAndResend(msg.id, newText)}
                                    >{msg.content}</ChatBubble>
                                  </div>
                                ) : (
                                  <div key={msg.id} className="t1-chat__row t1-chat__row--assistant">
                                    {msg.steps && msg.steps.length > 0 && (
                                      <ReasoningLog inProgress={false} interrupted={false} steps={msg.steps}/>
                                    )}
                                    <Response
                                      title={msg.title}
                                      orderedList={msg.orderedList}
                                      unorderedList={msg.unorderedList}
                                      contentSlot={renderSlot(msg)}
                                      filterCount={msg.filterCount}
                                      sourceCount={msg.sourceCount}
                                      showFilter={!!msg.filterCount}
                                      showSource={!!msg.sourceCount}
                                      filterItems={msg.filterItems}
                                      sourceItems={msg.sourceItems}
                                      onRegenerate={msg.userText ? () => handleSend(msg.userText) : undefined}
                                    >
                                      {msg.body}
                                    </Response>
                                  </div>
                                )
                              )}
                              {(phase === 'thinking' || phase === 'thought' || phase === 'streaming') && pendingMeta && (
                                <div className="t1-chat__row t1-chat__row--assistant">
                                  {/* ReasoningLog stays mounted through ALL three phases —
                                      never unmounts so it never flashes off/on screen. */}
                                  <ReasoningLog
                                    inProgress={phase === 'thinking'}
                                    interrupted={false}
                                    steps={pendingMeta.steps}
                                  />
                                  {phase === 'streaming' && (
                                    <Response
                                      title={pendingMeta.title}
                                      filterCount={pendingMeta.filterCount}
                                      sourceCount={pendingMeta.sourceCount}
                                      showFilter={false}
                                      showSource={false}
                                      showFeedback={false}
                                    >
                                      <span ref={streamBodyRef} /><span className="ts-ai-cursor" aria-hidden="true"/>
                                    </Response>
                                  )}
                                </div>
                              )}
                            </div>
                          )}
                        </div>

                        {/* PromptInput */}
                        <div className="ts-ai-input">
                          <PromptInput
                            onSend={handleSend}
                            loading={phase !== 'idle'}
                            disabled={phase !== 'idle'}
                            placeholder='Ask anything or press "/" for shortcuts'
                          />
                          <p className="ts-ai-disclaimer">AI Assistant can make mistakes, so please verify responses.</p>
                        </div>
                         </React.Fragment>
                        )}

                      </div>{/* /ts-ai-panel__chat */}
                    </div>{/* /ts-ai-panel__body */}

                  </div>
                )}{/* /ts-ai-panel */}

              </div>{/* /ts-main__inner */}
            </div>{/* /ts-main */}

          </div>{/* /ts-body */}

          {/* Onboarding completion modal — terminal overlay */}
          {(screen === 'complete' || screen === 'complete-zero') && (
            <CompletionModal onb={onb} navigate={navigate} />
          )}

          {/* Screen index — prototype browsing aid */}
          <ScreenIndex screen={screen} navigate={navigate} open={navOpen} setOpen={setNavOpen} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ChatApp/>);
  });
  </script>
</body>
</html>
